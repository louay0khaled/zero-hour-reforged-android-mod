; Arabic language definition — Zero Hour Reforged on Android (v1.29).
; Faces are the bundled Thmanyah Serif Display (Regular + Black) with Noto Sans
; Arabic as the bundled fallback for any codepoint Thmanyah lacks. The engine
; registers LocalFontFile entries with the FreeType glyph rasteriser by family
; name; UnicodeFontName is the face the renderer looks up first.
UnicodeFontName = "Thmanyah Serif Display"
LocalFontFile = Data\Arabic\Fonts\thmanyahserifdisplay-Regular.otf
LocalFontFile = Data\Arabic\Fonts\thmanyahserifdisplay-Black.otf
LocalFontFile = Data\Arabic\Fonts\NotoSansArabic-Regular.ttf
MilitaryCaptionSpeed = 0
UseHardWordWrap = FALSE
ResolutionFontAdjustment = 0.7
CopyrightFont = "Thmanyah Serif Display" 10 FALSE
MessageFont = "Thmanyah Serif Display" 14 FALSE
MilitaryCaptionTitleFont = "Thmanyah Serif Display Black" 16 TRUE
MilitaryCaptionDelayMS = 750
