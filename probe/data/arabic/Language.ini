SuperweaponCountdownNormalFont = "Thmanyah Serif Display" 18 FALSE
SuperweaponCountdownReadyFont = "Thmanyah Serif Display Black" 18 TRUE
NamedTimerCountdownNormalFont = "Thmanyah Serif Display" 14 FALSE
NamedTimerCountdownReadyFont = "Thmanyah Serif Display Black" 14 TRUE
DrawableCaptionFont = "Thmanyah Serif Display" 12 FALSE
DefaultWindowFont = "Thmanyah Serif Display" 12 FALSE
DefaultDisplayStringFont = "Thmanyah Serif Display" 12 FALSE
TooltipFontName = "Thmanyah Serif Display" 12 FALSE
