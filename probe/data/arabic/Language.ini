; Arabic language definition — Zero Hour Reforged on Android (v1.30.2).
; Thmanyah Serif Display ONLY (Regular + Black), by the owner's call: the
; shaper emits only forms Thmanyah draws (isolated forms go out as the base
; letter, lam-alef as its joined pair), so no fallback face is bundled.
; The engine registers LocalFontFile entries with the FreeType glyph
; rasteriser by family name; UnicodeFontName is the face looked up first.
Language
UnicodeFontName = "Thmanyah Serif Display"
LocalFontFile = Data\Arabic\Fonts\thmanyahserifdisplay-Regular.otf
LocalFontFile = Data\Arabic\Fonts\thmanyahserifdisplay-Black.otf
MilitaryCaptionSpeed = 0
UseHardWordWrap = no
ResolutionFontAdjustment = 0.7
CopyrightFont = "Thmanyah Serif Display" 10 no
MessageFont = "Thmanyah Serif Display" 14 no
MilitaryCaptionTitleFont = "Thmanyah Serif Display Black" 16 yes
MilitaryCaptionDelayMS = 750
MilitaryCaptionFont = "Thmanyah Serif Display" 12 no
SuperweaponCountdownNormalFont = "Thmanyah Serif Display" 18 no
SuperweaponCountdownReadyFont = "Thmanyah Serif Display Black" 18 yes
NamedTimerCountdownNormalFont = "Thmanyah Serif Display" 14 no
NamedTimerCountdownReadyFont = "Thmanyah Serif Display Black" 14 yes
DrawableCaptionFont = "Thmanyah Serif Display" 12 no
DefaultWindowFont = "Thmanyah Serif Display" 12 no
DefaultDisplayStringFont = "Thmanyah Serif Display" 12 no
TooltipFontName = "Thmanyah Serif Display" 12 no
NativeDebugDisplay = "Thmanyah Serif Display" 12 no
DrawGroupInfoFont = "Thmanyah Serif Display" 12 no
CreditsTitleFont = "Thmanyah Serif Display Black" 14 yes
CreditsMinorTitleFont = "Thmanyah Serif Display" 12 no
CreditsNormalFont = "Thmanyah Serif Display" 12 no
