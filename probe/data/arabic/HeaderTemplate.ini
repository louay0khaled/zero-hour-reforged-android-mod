;// FILE: HeaderTemplate.ini ///////////////////////////////////////
;// Arabic edition for the Reforged Android port (2026-11-21).
;// Same 15 templates, names, points and bold flags as the retail English
;// file (verified byte-identical across two independent extractions of
;// EnglishZH.big). The retail faces ("Generals" / "Arial") do not exist in
;// the Arabic font list, so every template uses the Arabic UI face --
;// "Thmanyah Serif Display" -- exactly as Language.ini maps all Arabic
;// fonts to Thmanyah. Bold uses the yes/no dialect INI::scanBool accepts.
;// One addition at the end: ControlBarProScrollListBox025, referenced by
;// the ControlBar Pro windows in the overlay; the engine reads exactly
;// one per-language HeaderTemplate.ini, so the mod's own template can
;// only ever come from this file.

;// Whenever we have large Titles
HeaderTemplate Title
  Font = "Thmanyah Serif Display"
  Point = 20
  Bold = No
End

;//This will be used for the buttons at the bottom of the screens
HeaderTemplate MainButton
  Font = "Thmanyah Serif Display"
  Point = 15
  Bold = No
End

;//This is used for all the rest of the buttons
HeaderTemplate Button
  Font = "Thmanyah Serif Display"
  Point = 12
  Bold = No
End

;//This is used for all the small buttons (Like the save load buttons for the campaigns
HeaderTemplate ButtonSmall
  Font = "Thmanyah Serif Display"
  Point = 10
  Bold = No
End

;// wherever we enter text we'll try to always use this
HeaderTemplate TextEntry
  Font = "Thmanyah Serif Display"
  Point = 10
  Bold = No
End

;// wherever we enter text we'll try to always use this
HeaderTemplate ComboBoxEntry
  Font = "Thmanyah Serif Display"
  Point = 10
  Bold = No
End

;// Used for all sub headings
HeaderTemplate MinorTitle
  Font = "Thmanyah Serif Display"
  Point = 14
  Bold = No
End

;// Used wherever we have static text labels (for example, all the score screen player information
HeaderTemplate LabelRegular
  Font = "Thmanyah Serif Display"
  Point = 10
  Bold = No
End

;// Used wherever we have small static text labels (for example, On the side select window)
HeaderTemplate LabelSmall
  Font = "Thmanyah Serif Display"
  Point = 8
  Bold = No
End

;// Used only on the loadscreen under the cameos that popup partway through the load movie
HeaderTemplate LoadScreenCameos
  Font = "Thmanyah Serif Display"
  Point = 10
  Bold = No
End

;// Used only on the loadscreen located at the bottom of the zoomed in map
HeaderTemplate LoadScreenMissionLocation
  Font = "Thmanyah Serif Display"
  Point = 14
  Bold = No
End

HeaderTemplate Arial10BoldTemplate
  Font = "Thmanyah Serif Display"
  Point = 10
  Bold = Yes
End

HeaderTemplate Arial12BoldTemplate
  Font = "Thmanyah Serif Display"
  Point = 12
  Bold = Yes
End

HeaderTemplate Arial14Template
  Font = "Thmanyah Serif Display"
  Point = 14
  Bold = No
End

HeaderTemplate Arial14BoldTemplate
  Font = "Thmanyah Serif Display"
  Point = 14
  Bold = Yes
End

;// Addition (not in the retail file): the ControlBar Pro scroll list
;// window in the overlay names this template.
HeaderTemplate ControlBarProScrollListBox025
  Font = "Thmanyah Serif Display"
  Point = 10
  Bold = No
End
