name: Build Reforged GPU Probe (stage C0)

# Stage C, slice C0 (see probe/README.md): upstream's unmodified
# sdl_gpu_probe (Reforged @ 61dbc59) packaged as a standalone, throwaway
# Android APK (com.louay.zerohour.gpuprobe) against upstream's pinned
# SDL 3.4.16. Manual dispatch only. Deliberately separate from
# build-apk.yml — the game build never sees this workflow, and this
# workflow never touches the game.

on:
  workflow_dispatch:
    inputs:
      sdl_java:
        description: "SDL Java layer packaged into the probe APK. host = the game shell's staged SDL 3.4.2 Java driving the 3.4.16 native library (stage-C plan, C0 proof 5). upstream = SDL 3.4.16's own Java from the pinned tree."
        type: choice
        options:
          - host
          - upstream
        default: host

env:
  SDL_ZIP_URL: https://github.com/libsdl-org/SDL/archive/fa2c02bb6e21974a89ea9824bc53c9932abe5f9c.zip
  SDL_ZIP_SHA256: ab7a774d41332dc73e6cad6ed9cb14b91cb1de76497dca116be7080f069a703a
  PROBE_CPP_SHA256: dc8bbf25bfd6153139cb744b600782629faa90a0320aa05cf11de0f26a5d28f0
  DETROUND_CPP_SHA256: ca2ac4008754f3d1eb60abf2cbc929aaf94eeef49b9319aad49115902b77a00d
  DETROUND_H_SHA256: 38b9d2313af7f44ce6df878d9a5dff7899a382e5d40fd716d535a32c8a14cff4
  MYSOREZ_REF: a520ed1b693f18fd1404d2cc85b33ba041b52523
  # The host's own SDL pin, taken from MYSOREZ @ a520ed1 (cmake/sdl3.cmake).
  # The "host" SDL Java layer is staged from THIS tarball plus the host
  # repo's android/patches/*.patch — never read out of the host checkout
  # (its java-sdl directory is generated + gitignored; see the Select step).
  HOST_SDL_TARBALL_URL: https://github.com/libsdl-org/SDL/releases/download/release-3.4.2/SDL3-3.4.2.tar.gz
  HOST_SDL_TARBALL_SHA256: ef39a2e3f9a8a78296c40da701967dd1b0d0d6e267e483863ce70f8a03b4050c
  NDK_VERSION: 26.1.10909125
  ANDROIDX_CORE_AAR_SHA256: 2c27de199535675005553066597a4b20fa1eea7c228ab4ef6b32b5fe39ca1f59
  R8_JAR_URL: https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.5.35/r8-8.5.35.jar
  R8_JAR_SHA256: 4733945987ee0a840fafc34080b135259e01678412e07212b23f706334290294

jobs:
  build-probe:
    name: ReforgedGpuProbe-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod repo (probe sources)
        uses: actions/checkout@v4

      - name: Checkout MYSOREZ port (host SDL Java patches, pinned)
        if: inputs.sdl_java == 'host'
        uses: actions/checkout@v4
        with:
          repository: MYSOREZ/GeneralsZH-Android-Port
          ref: ${{ env.MYSOREZ_REF }}
          path: mysorez

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages (NDK r26, platform 34, build-tools 34)
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify vendored upstream files are byte-identical (hash pins)
        run: |
          set -euo pipefail
          echo "${PROBE_CPP_SHA256}  probe/sdl_gpu_probe.cpp" | sha256sum -c -
          echo "${DETROUND_CPP_SHA256}  probe/test_detround.cpp" | sha256sum -c -
          echo "${DETROUND_H_SHA256}  probe/include/Lib/DetRound.h" | sha256sum -c -

      - name: Fetch pinned SDL 3.4.16 (the archive vendor.sh pins)
        run: |
          set -euo pipefail
          curl -sL -o sdl.zip "$SDL_ZIP_URL"
          echo "${SDL_ZIP_SHA256}  sdl.zip" | sha256sum -c -
          unzip -q sdl.zip
          echo "SDL_SOURCE_DIR=$PWD/SDL-fa2c02bb6e21974a89ea9824bc53c9932abe5f9c" >> "$GITHUB_ENV"

      - name: Side artefact — test_detround.cpp under the NDK determinism flags
        run: |
          set -euo pipefail
          CLANGXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          "$CLANGXX" --target=aarch64-linux-android28 -std=c++17 \
            -ffp-contract=off -fsigned-char -fno-delete-null-pointer-checks \
            -I probe/include -c probe/test_detround.cpp -o /tmp/test_detround.o
          echo "test_detround.cpp compiled clean: NDK clang, Reforged determinism-flag spelling admitted"

      - name: Build native libraries (SDL 3.4.16 + libmain.so)
        run: |
          set -euo pipefail
          cmake -S probe -B probe-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SOURCE_DIR="$SDL_SOURCE_DIR"
          cmake --build probe-build -j"$(nproc)"
          find probe-build -name "*.so" -type f | sort

      - name: Select SDL Java layer
        run: |
          set -euo pipefail
          if [ "${{ inputs.sdl_java }}" = "host" ]; then
            # android/app/src/main/java-sdl in the host repo is GENERATED and
            # gitignored (android/.gitignore): the host's own packaging
            # script (scripts/build/android/package-android-zh.sh, step 2)
            # stages it on every build from the host's pinned SDL tarball
            # plus android/patches/*.patch, so a fresh checkout NEVER
            # contains it — probe run #1 died on exactly this. Reproduce
            # that staging here, step for step, and point JAVA_SRC_DIR at
            # the staged result.
            curl -sL -o host-sdl.tar.gz "$HOST_SDL_TARBALL_URL"
            echo "${HOST_SDL_TARBALL_SHA256}  host-sdl.tar.gz" | sha256sum -c -
            mkdir -p host-sdl-src && tar -xzf host-sdl.tar.gz -C host-sdl-src --strip-components=1
            mkdir -p "$PWD/host-java-sdl/org/libsdl/app"
            cp host-sdl-src/android-project/app/src/main/java/org/libsdl/app/*.java "$PWD/host-java-sdl/org/libsdl/app/"
            for p in mysorez/android/patches/*.patch; do
              [ -f "$p" ] || continue
              patch -p1 -d "$PWD/host-java-sdl" < "$p"
            done
            # Fail loud if the host patch did not land — its AndroidX
            # adaptation is what makes this variant the host's, not vanilla.
            grep -q 'androidx.core.view.WindowCompat' "$PWD/host-java-sdl/org/libsdl/app/SDLActivity.java"
            echo "JAVA_SRC_DIR=$PWD/host-java-sdl" >> "$GITHUB_ENV"
            echo "Packaging the HOST shell's staged SDL Java (3.4.2 + host patches) against the 3.4.16 native library"
            # The host's staged SDLActivity is adapted to AndroidX Core
            # (WindowCompat) — the game's own pin, androidx.core:core:1.13.1
            # (android/app/build.gradle). Its classes must be compiled
            # against AND dexed into the probe APK.
            curl -sL -o core.aar "https://dl.google.com/dl/android/maven2/androidx/core/core/1.13.1/core-1.13.1.aar"
            echo "${ANDROIDX_CORE_AAR_SHA256}  core.aar" | sha256sum -c -
            unzip -q core.aar classes.jar -d core-aar
            echo "EXTRA_CP=$PWD/core-aar/classes.jar" >> "$GITHUB_ENV"
            echo "EXTRA_DEX_JARS=$PWD/core-aar/classes.jar" >> "$GITHUB_ENV"
          else
            echo "JAVA_SRC_DIR=$SDL_SOURCE_DIR/android-project/app/src/main/java" >> "$GITHUB_ENV"
            echo "Packaging SDL 3.4.16's own Java"
          fi

      - name: Fetch pinned standalone R8 (dexer)
        run: |
          set -euo pipefail
          # build-tools 34.0.0's bundled d8 (R8 8.2.2-dev) crashes with an
          # internal NPE on the SDL Java classes — locally reproduced. The
          # pinned release R8 8.5.35 dexes both Java variants cleanly
          # (locally verified 2026-11-12).
          curl -sL -o r8.jar "$R8_JAR_URL"
          echo "${R8_JAR_SHA256}  r8.jar" | sha256sum -c -
          echo "R8_JAR=$PWD/r8.jar" >> "$GITHUB_ENV"

      - name: Package probe APK
        run: |
          set -euo pipefail
          export PROBE_DIR="$PWD/probe"
          export NATIVE_BUILD_DIR="$PWD/probe-build"
          export NDK_HOME="$ANDROID_NDK_HOME"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          export OUT_APK="$PWD/ReforgedGpuProbe.apk"
          bash probe/build-apk.sh

      - name: Upload probe APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReforgedGpuProbe-apk
          path: ReforgedGpuProbe.apk
          if-no-files-found: error
