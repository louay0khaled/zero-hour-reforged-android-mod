name: Build Reforged GPU Probe (stage C0/C2)

# Stage C, slices C0 + C2 (see probe/README.md): upstream's unmodified
# sdl_gpu_probe (Reforged @ 61dbc59) packaged as a standalone, throwaway
# Android APK (com.louay.zerohour.gpuprobe) against upstream's pinned
# SDL 3.4.16. With harness=renderer the same APK additionally carries the
# engine's own selfchecks (sdl_gpu_frame_selfcheck +
# sdl_gpu_depth_format_selfcheck), built from source in this workflow
# from the same pinned tree with the formalised C1 patch set
# (probe/patches/) and packaged as child-process payloads for the
# harness shim. Manual dispatch only. Deliberately separate from
# build-apk.yml — the game build never sees this workflow, and this
# workflow never touches the game.

on:
  workflow_dispatch:
    inputs:
      harness:
        description: "Which instruments the APK carries. probe = the C0 GPU capability probe only. renderer = C0 probe + the C2 engine selfchecks (built from the pinned Reforged tree in this run; the launcher gains a 'Run renderer selfcheck' button). Renderer runs pair with sdl_java=upstream; device_mode affects only the C0 probe's own device creation, never the selfcheck payloads (they create their device inside the engine's fixed call site)."
        type: choice
        options:
          - probe
          - renderer
        default: probe
      sdl_java:
        description: "SDL Java layer packaged into the probe APK. host = the game shell's staged SDL 3.4.2 Java driving the 3.4.16 native library (stage-C plan, C0 proof 5). upstream = SDL 3.4.16's own Java from the pinned tree."
        type: choice
        options:
          - host
          - upstream
        default: host
      device_mode:
        description: "How the probe creates its SDL GPU device. plain = SDL_CreateGPUDevice with SDL's defaults, which require the Vulkan depthClamp + shaderClipDistance features — failed on the owner's Mali-G52 (stage C0 record section 8). compat = the same call routed through the harness shim to SDL_CreateGPUDeviceWithProperties with those two feature properties off (SDL_gpu.h:2380-2381); the probe source stays byte-identical either way."
        type: choice
        options:
          - plain
          - compat
        default: plain

env:
  SDL_ZIP_URL: https://github.com/libsdl-org/SDL/archive/fa2c02bb6e21974a89ea9824bc53c9932abe5f9c.zip
  SDL_ZIP_SHA256: ab7a774d41332dc73e6cad6ed9cb14b91cb1de76497dca116be7080f069a703a
  PROBE_CPP_SHA256: dc8bbf25bfd6153139cb744b600782629faa90a0320aa05cf11de0f26a5d28f0
  DETROUND_CPP_SHA256: ca2ac4008754f3d1eb60abf2cbc929aaf94eeef49b9319aad49115902b77a00d
  DETROUND_H_SHA256: 38b9d2313af7f44ce6df878d9a5dff7899a382e5d40fd716d535a32c8a14cff4
  MYSOREZ_REF: a520ed1b693f18fd1404d2cc85b33ba041b52523
  # The host's own SDL pin, taken from MYSOREZ @ a520ed1 (cmake/sdl3.cmake).
  # The "host" SDL Java layer is staged from THIS tarball plus the host
  # repo's android/patches/*.patch — never read out of the host checkout
  # (its java-sdl directory is generated + gitignored; see the Select step).
  HOST_SDL_TARBALL_URL: https://github.com/libsdl-org/SDL/releases/download/release-3.4.2/SDL3-3.4.2.tar.gz
  HOST_SDL_TARBALL_SHA256: ef39a2e3f9a8a78296c40da701967dd1b0d0d6e267e483863ce70f8a03b4050c
  NDK_VERSION: 26.1.10909125
  # Stage C2: the renderer payloads are built from the pinned Reforged
  # tree with the C1 route, which was proven against NDK r27c — not the
  # harness's r26 — and API 28 (see the payload steps below).
  REFORGED_REPO: olcayseygan/cncgeneralszh-reforged
  REFORGED_PIN: 61dbc593fb4eecb7af891b80c4c491c3ad2b791d
  ENGINE_NDK_VERSION: 27.2.12479018
  ANDROIDX_CORE_AAR_SHA256: 2c27de199535675005553066597a4b20fa1eea7c228ab4ef6b32b5fe39ca1f59
  R8_JAR_URL: https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.5.35/r8-8.5.35.jar
  R8_JAR_SHA256: 4733945987ee0a840fafc34080b135259e01678412e07212b23f706334290294

jobs:
  build-probe:
    name: ReforgedGpuProbe-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod repo (probe sources)
        uses: actions/checkout@v4

      - name: Checkout MYSOREZ port (host SDL Java patches, pinned)
        if: inputs.sdl_java == 'host'
        uses: actions/checkout@v4
        with:
          repository: MYSOREZ/GeneralsZH-Android-Port
          ref: ${{ env.MYSOREZ_REF }}
          path: mysorez

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages (NDK r26, platform 34, build-tools 34)
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify vendored upstream files are byte-identical (hash pins)
        run: |
          set -euo pipefail
          echo "${PROBE_CPP_SHA256}  probe/sdl_gpu_probe.cpp" | sha256sum -c -
          echo "${DETROUND_CPP_SHA256}  probe/test_detround.cpp" | sha256sum -c -
          echo "${DETROUND_H_SHA256}  probe/include/Lib/DetRound.h" | sha256sum -c -

      - name: Fetch pinned SDL 3.4.16 (the archive vendor.sh pins)
        run: |
          set -euo pipefail
          curl -sL -o sdl.zip "$SDL_ZIP_URL"
          echo "${SDL_ZIP_SHA256}  sdl.zip" | sha256sum -c -
          unzip -q sdl.zip
          echo "SDL_SOURCE_DIR=$PWD/SDL-fa2c02bb6e21974a89ea9824bc53c9932abe5f9c" >> "$GITHUB_ENV"

      - name: Side artefact — test_detround.cpp under the NDK determinism flags
        run: |
          set -euo pipefail
          CLANGXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          "$CLANGXX" --target=aarch64-linux-android28 -std=c++17 \
            -ffp-contract=off -fsigned-char -fno-delete-null-pointer-checks \
            -I probe/include -c probe/test_detround.cpp -o /tmp/test_detround.o
          echo "test_detround.cpp compiled clean: NDK clang, Reforged determinism-flag spelling admitted"

      - name: Build native libraries (SDL 3.4.16 + libmain.so)
        run: |
          set -euo pipefail
          cmake -S probe -B probe-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DPROBE_DEVICE_MODE=${{ inputs.device_mode }} \
            -DSDL_SOURCE_DIR="$SDL_SOURCE_DIR"
          cmake --build probe-build -j"$(nproc)"
          find probe-build -name "*.so" -type f | sort

      - name: Checkout Reforged engine tree (pinned, C2 payloads)
        if: inputs.harness == 'renderer'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REFORGED_REPO }}
          ref: ${{ env.REFORGED_PIN }}
          path: reforged

      - name: Install Android NDK r27c (C1-proven engine toolchain)
        if: inputs.harness == 'renderer'
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "ndk;${ENGINE_NDK_VERSION}"
          echo "ENGINE_NDK_HOME=$ANDROID_HOME/ndk/${ENGINE_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build renderer selfcheck payloads from the pinned tree (C1 route)
        if: inputs.harness == 'renderer'
        run: |
          set -euo pipefail
          SRC="$PWD/reforged"
          # The formalised C1 patch set (probe/patches/) — locally verified
          # byte-equivalent to the C1 compile-proof diff (11 files,
          # +99/-4); the rehearsal of this exact sequence is recorded in
          # stage-c-c1-plan.md section 7.
          git -C "$SRC" apply --check "$PWD/probe/patches/reforged-c1-android.patch"
          git -C "$SRC" apply "$PWD/probe/patches/reforged-c1-android.patch"
          git -C "$SRC" diff --stat | tail -3
          # Stage C2 frame-entry fix (probe/patches/, section 8 of the C1
          # plan): without it the bare-exec'd frame payload is refused by
          # SDL_Init (SDL_MAIN_NEEDED main-ready flag is only ever set by
          # SDLActivity's trampoline) and the device run ends as a spurious
          # SKIP / exit 77 before any GPU code runs. Marker-checked.
          git -C "$SRC" apply --check "$PWD/probe/patches/reforged-frame-selfcheck-entry.patch"
          git -C "$SRC" apply "$PWD/probe/patches/reforged-frame-selfcheck-entry.patch"
          test -f "$SRC/GeneralsMD/Code/Tests/frame_selfcheck_main.cpp"
          grep -q "sdl_gpu_frame_selfcheck_body" "$SRC/GeneralsMD/Code/CMakeLists.txt"
          echo "frame entry patch applied; launcher TU + CMake wiring present"
          # Vendor the pinned archives exactly as C1 did (vendor.sh
          # downloads them from their pinned URLs).
          bash "$SRC/GeneralsMD/Code/Tools/vendor.sh"
          # GameSpy pthread patch (C1 blocker B5, formalised) into the
          # vendored tree, with its marker checked — same git-apply-into-
          # the-destination mechanics vendor.sh itself uses.
          GS="$SRC/GeneralsMD/Code/Libraries/Source/GameSpy"
          test -f "$GS/src/common/linux/gsthreadlinux.c"
          GIT_CEILING_DIRECTORIES="$SRC/GeneralsMD/Code/Libraries/Source" \
            git -C "$GS" -c core.autocrlf=false apply "$PWD/probe/patches/gamespy-android-pthread.patch"
          grep -q "bionic has no pthread_cancel" "$GS/src/common/linux/gsthreadlinux.c"
          echo "GameSpy pthread patch applied; marker present"
          # Host build_fingerprint (C1 blocker B4 shim): the engine build
          # invokes it from PATH; build it for the runner's own arch.
          mkdir -p "$PWD/host-tools"
          c++ -O2 -std=c++17 "$SRC/GeneralsMD/Code/Tools/fingerprint/build_fingerprint.cpp" \
            -o "$PWD/host-tools/build_fingerprint"
          export PATH="$PWD/host-tools:$PATH"
          # Configure + build the two selfcheck targets (C1 line, NDK r27c).
          cmake -S "$SRC/GeneralsMD/Code" -B "$PWD/engine-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ENGINE_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$PWD/engine-build" --target sdl_gpu_depth_format_selfcheck -j"$(nproc)"
          cmake --build "$PWD/engine-build" --target sdl_gpu_frame_selfcheck -j"$(nproc)"
          # Stage the payloads under their packaged lib*.so names (the
          # package manager extracts them next to libmain.so as real,
          # executable files; the shim dladdr-locates and execs them).
          mkdir -p "$PWD/payloads"
          cp "$PWD/engine-build/sdl_gpu_frame_selfcheck" "$PWD/payloads/libsdl_gpu_frame_selfcheck.so"
          cp "$PWD/engine-build/sdl_gpu_depth_format_selfcheck" "$PWD/payloads/libsdl_gpu_depth_format_selfcheck.so"
          for f in "$PWD/payloads/libsdl_gpu_frame_selfcheck.so" "$PWD/payloads/libsdl_gpu_depth_format_selfcheck.so"; do
            file "$f" | grep -q "ELF 64-bit LSB pie executable, ARM aarch64" \
              || { echo "payload is not an AArch64 PIE: $f"; file "$f"; exit 1; }
          done
          # The C1 section-5 compat fix must be inside the frame payload:
          # the engine creates its device through
          # SDL_CreateGPUDeviceWithProperties on Android.
          grep -a -q "SDL_CreateGPUDeviceWithProperties" "$PWD/payloads/libsdl_gpu_frame_selfcheck.so" \
            || { echo "compat device-creation call site missing from the frame selfcheck"; exit 1; }
          # The C2 entry fix must be inside the frame payload too: the
          # renamed body symbol only exists if the launcher wiring built.
          grep -a -q "sdl_gpu_frame_selfcheck_body" "$PWD/payloads/libsdl_gpu_frame_selfcheck.so" \
            || { echo "frame entry trampoline missing from the frame selfcheck"; exit 1; }
          ls -la "$PWD/payloads"
          sha256sum "$PWD/payloads/libsdl_gpu_frame_selfcheck.so" "$PWD/payloads/libsdl_gpu_depth_format_selfcheck.so"
          echo "PAYLOAD_DIR=$PWD/payloads" >> "$GITHUB_ENV"

      - name: Select SDL Java layer
        run: |
          set -euo pipefail
          if [ "${{ inputs.sdl_java }}" = "host" ]; then
            # android/app/src/main/java-sdl in the host repo is GENERATED and
            # gitignored (android/.gitignore): the host's own packaging
            # script (scripts/build/android/package-android-zh.sh, step 2)
            # stages it on every build from the host's pinned SDL tarball
            # plus android/patches/*.patch, so a fresh checkout NEVER
            # contains it — probe run #1 died on exactly this. Reproduce
            # that staging here, step for step, and point JAVA_SRC_DIR at
            # the staged result.
            curl -sL -o host-sdl.tar.gz "$HOST_SDL_TARBALL_URL"
            echo "${HOST_SDL_TARBALL_SHA256}  host-sdl.tar.gz" | sha256sum -c -
            mkdir -p host-sdl-src && tar -xzf host-sdl.tar.gz -C host-sdl-src --strip-components=1
            mkdir -p "$PWD/host-java-sdl/org/libsdl/app"
            cp host-sdl-src/android-project/app/src/main/java/org/libsdl/app/*.java "$PWD/host-java-sdl/org/libsdl/app/"
            for p in mysorez/android/patches/*.patch; do
              [ -f "$p" ] || continue
              patch -p1 -d "$PWD/host-java-sdl" < "$p"
            done
            # Fail loud if the host patch did not land — its AndroidX
            # adaptation is what makes this variant the host's, not vanilla.
            grep -q 'androidx.core.view.WindowCompat' "$PWD/host-java-sdl/org/libsdl/app/SDLActivity.java"
            echo "JAVA_SRC_DIR=$PWD/host-java-sdl" >> "$GITHUB_ENV"
            echo "Packaging the HOST shell's staged SDL Java (3.4.2 + host patches) against the 3.4.16 native library"
            # The host's staged SDLActivity is adapted to AndroidX Core
            # (WindowCompat) — the game's own pin, androidx.core:core:1.13.1
            # (android/app/build.gradle). Its classes must be compiled
            # against AND dexed into the probe APK.
            curl -sL -o core.aar "https://dl.google.com/dl/android/maven2/androidx/core/core/1.13.1/core-1.13.1.aar"
            echo "${ANDROIDX_CORE_AAR_SHA256}  core.aar" | sha256sum -c -
            unzip -q core.aar classes.jar -d core-aar
            echo "EXTRA_CP=$PWD/core-aar/classes.jar" >> "$GITHUB_ENV"
            echo "EXTRA_DEX_JARS=$PWD/core-aar/classes.jar" >> "$GITHUB_ENV"
          else
            echo "JAVA_SRC_DIR=$SDL_SOURCE_DIR/android-project/app/src/main/java" >> "$GITHUB_ENV"
            echo "Packaging SDL 3.4.16's own Java"
          fi

      - name: Fetch pinned standalone R8 (dexer)
        run: |
          set -euo pipefail
          # build-tools 34.0.0's bundled d8 (R8 8.2.2-dev) crashes with an
          # internal NPE on the SDL Java classes — locally reproduced. The
          # pinned release R8 8.5.35 dexes both Java variants cleanly
          # (locally verified 2026-11-12).
          curl -sL -o r8.jar "$R8_JAR_URL"
          echo "${R8_JAR_SHA256}  r8.jar" | sha256sum -c -
          echo "R8_JAR=$PWD/r8.jar" >> "$GITHUB_ENV"

      - name: Package probe APK
        run: |
          set -euo pipefail
          export PROBE_DIR="$PWD/probe"
          export NATIVE_BUILD_DIR="$PWD/probe-build"
          export NDK_HOME="$ANDROID_NDK_HOME"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          export OUT_APK="$PWD/ReforgedGpuProbe.apk"
          bash probe/build-apk.sh

      - name: Upload probe APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.harness == 'renderer' && 'ReforgedRendererSelfcheck-apk' || 'ReforgedGpuProbe-apk' }}
          path: ReforgedGpuProbe.apk
          if-no-files-found: error
