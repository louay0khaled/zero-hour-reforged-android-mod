name: Build Zero Hour Reforged APK

# Zero Hour Reforged CI: builds the APK from the PUBLIC upstream
# MYSOREZ/GeneralsZH-Android-Port tree (pinned commit) plus this repo's
# overlay (ci/): the engine patches, the package-id surgery scripts,
# and the Stage C test payload. Nothing of the multi-GB engine tree
# lives in this repo -- it is checked out fresh from upstream on every
# run and the overlay is applied on top.
#
# v1.20 (owner order 2026-11-19): NO PLAY ENGINE AT ALL. All effort is
# on the second engine (Reforged's own, Stage C); the 60-steps engine is
# parked and NOT built or packaged in this line -- the APK carries only
# the Stage C payload (libmainrfx.so + libmainrfxgame.so). The launcher's
# Play entry therefore has no library to load in these builds, by the
# owner's explicit order ("for speed"). The v1.16/v1.17 text below is
# the parked line's description, kept for when it resumes.
#
# v1.16 (owner orders 2026-11-17): PURE AND SINGLE-ENGINED. The APK
# carries exactly ONE play engine, libmainz60.so -- a true 60-steps
# build of the PRISTINE stock engine (the n60 patch set: foundations,
# the GlobalData anchor, the flip, the derived Z60 stamp, speed
# pacing; NO Reforged additions of any kind) -- plus libmainrfx.so,
# the Stage C tests payload, which stays by the owner's order. The
# retired Reforged engines (libmainrf.so, libmainrf60.so) are REMOVED
# and forbidden in the package checks below; no Reforged data is
# bundled (phase 2 no longer runs -- the player's game folder is
# played exactly as it is). There is no engine switch anywhere:
# GeneralsZHActivity names the one library directly, so the
# stale-engine trap of v1.15 (a pref naming a library the process
# never loaded) cannot recur. The base tree is build scaffolding
# only: identity surgery (package id, native data paths, label,
# update channel) plus our launcher pages; its standard engines are
# still built because the packaging script and the shared-library
# staging (SDL3, OpenAL, GameSpy, DXVK, hooks) read that build tree --
# but the packaging script's GX_OMIT_HOST_ENGINES knob keeps
# libmain.so and libgenerals.so out of the APK. The shell's Generals
# side is sealed (getSelectedGame always answers Zero Hour) and
# GeneralsOnline is not reachable from this app -- the owner's
# original MYSOREZ app remains installed for that.
# Signing stays LOCAL (project decision): this workflow's artifact is
# the AGP release output, debug-signed by the project's own config.
# The owner re-signs the artifact with the dedicated keystore before
# publishing a Release.
#
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version_name:
        type: string
        description: "Override versionName (blank = build.gradle default, currently '1.17'). Bump together with version_code for a new release."
        default: ""
      version_code:
        type: string
        description: "Override versionCode (blank = build.gradle default, currently 22). Must increase between published releases."
        default: ""

env:
  PRESET: android-vulkan
  # Pinned upstream commit the overlay was extracted and verified against
  # (the v1 local build tree). Bump only with a re-extracted overlay.
  MYSOREZ_REF: a520ed1b693f18fd1404d2cc85b33ba041b52523
  REFORGED_REPO: olcayseygan/cncgeneralszh-reforged
  REFORGED_PIN: 61dbc593fb4eecb7af891b80c4c491c3ad2b791d
  # Toolchain pins, identical to upstream's own build-android.yml.
  NDK_VERSION: "27.2.12479018"
  GRADLE_VERSION: "8.9"
  CMDLINE_TOOLS_VERSION: "13114758"
  CMDLINE_TOOLS_SHA1: "5fdcc763663eefb86a5b8879697aa6088b041e70"
  VCPKG_COMMIT: "42e4e33e1505c9f47b58c21e0f557c1571b751ee"

jobs:
  build-apk:
    name: ZeroHourReforged-apk
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout MYSOREZ port (pinned)
        uses: actions/checkout@v4
        with:
          repository: MYSOREZ/GeneralsZH-Android-Port
          ref: ${{ env.MYSOREZ_REF }}
          fetch-depth: 0
          submodules: false

      - name: Checkout Reforged overlay (this repo)
        uses: actions/checkout@v4
        with:
          path: reforged-overlay

      - name: Checkout Reforged engine (pinned, C3 payload)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REFORGED_REPO }}
          ref: ${{ env.REFORGED_PIN }}
          path: reforged-engine

      - name: Checkout DXVK fork submodule
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 references/fbraz3-dxvk
          # DXVK's OWN submodules (SPIRV-Headers, Vulkan-Headers,
          # libdisplay-info) — meson dies without them; the superproject
          # init above is not recursive.
          git -C references/fbraz3-dxvk submodule update --init --depth 1
          echo "DXVK_REF=$(git rev-parse HEAD:references/fbraz3-dxvk)" >> "$GITHUB_ENV"

      # The second checkout is the ENGINE tree: pristine upstream,
      # plus the n60 patch set and the data-path surgery (phase 1b
      # only). It is built ONCE, with the 60-steps flip ON, and its
      # z_generals output ships as libmainz60.so -- since v1.16 the
      # only play engine in the APK (the tests payload aside).
      - name: Checkout engine tree (pristine + n60 patches)
        uses: actions/checkout@v4
        with:
          repository: MYSOREZ/GeneralsZH-Android-Port
          ref: ${{ env.MYSOREZ_REF }}
          path: reforged-src
          fetch-depth: 0
          submodules: false

      - name: Checkout DXVK fork submodule (Reforged tree)
        run: |
          set -euo pipefail
          git -C reforged-src submodule update --init --depth 1 references/fbraz3-dxvk
          git -C reforged-src/references/fbraz3-dxvk submodule update --init --depth 1

      # v1.16, base half: the main tree gets identity surgery
      # (phases 1a-1d), our launcher pages (phase 1e + phase 3) -- and
      # NO engine patch, NO phase 2 (no bundled data exists anymore).
      # ONE build-tooling exception: the packaging-script patch also
      # applies here, because the packaging step runs this tree's
      # script and the pristine script cannot package this build at
      # all (no release-task knob, no GX_ENGINE_LIB staging knob, no
      # GX_OMIT_HOST_ENGINES knob). The script is build tooling -- it
      # ships nothing and touches no engine or launcher code. v1.16
      # launcher facts asserted below: exactly one engine constant in
      # GeneralsZHActivity ("mainz60"), no engine pref or accessors
      # anywhere, the Reforged page carries only the slim WiFi status
      # card, the Simulation Rate section is never built (its method
      # remains, uncalled), and the deleted Online Mode is absent.
      - name: Apply identity surgery + Reforged page (base tree)
        run: |
          set -euo pipefail
          git apply --verbose reforged-overlay/ci/patches/package-android-zh-gradle-task.patch
          # Package-id surgery (the scripts resolve the MYSOREZ tree
          # as the parent of the overlay checkout). NO phase 2 since
          # v1.16: no bundled data exists to stage or force on.
          python3 reforged-overlay/ci/apply-surgery.py
          python3 reforged-overlay/ci/apply-phase3.py
          # Verify the overlay actually landed (fail loud, not silent):
          grep -q "applicationId 'com.louay.zerohour.reforged'" android/app/build.gradle
          ! grep -q "reforged_60_steps" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          ! grep -q "getReforged60" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          ! grep -q "reforged_enhanced_30" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          ! grep -q "buildReforgedModCard" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          grep -q "TAB_REFORGED" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          grep -q "buildReforgedPage" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          grep -q "buildSimRateSection" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          ! grep -q "buildSimRateSection(page);" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          grep -q "setup_card_reforged_wifi" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          grep -q '"mainz60"' android/app/src/main/java/com/generalsx/zerohour/GeneralsZHActivity.java
          ! grep -q "mainrf" android/app/src/main/java/com/generalsx/zerohour/GeneralsZHActivity.java
          grep -q "CLIENT_ID" android/app/src/main/java/com/generalsx/zerohour/GeneralsOnlineSession.java
          ! grep -q "ensureBundledReforgedData" android/app/src/main/java/com/generalsx/zerohour/ModManager.java
          ! grep -q "migrateOnlineModeState" android/app/src/main/java/com/generalsx/zerohour/ModManager.java
          ! grep -q "bundledModEnabled" android/app/src/main/java/com/generalsx/zerohour/ModManager.java
          # The UpdateManager engine-override load path is REMOVED by
          # surgery (kept from v1.8) -- its entry points must be absent
          # from the launcher activity (the APK's engines are the only
          # engines).
          ! grep -q "activeEngineLibrary" android/app/src/main/java/com/generalsx/zerohour/GeneralsZHActivity.java
          ! grep -q "activeEngineSeq" android/app/src/main/java/com/generalsx/zerohour/GeneralsZHActivity.java
          # v1.9: the deleted Online Mode leaves no trace in the base
          # launcher -- no accessors, no card, no strings. (ModManager
          # legitimately names the legacy prefs inside its migration;
          # it is not greped here.)
          ! grep -q "getOnlineMode" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          ! grep -q "getOnlineMode" android/app/src/main/java/com/generalsx/zerohour/GeneralsZHActivity.java
          ! grep -q "getOnlineMode" android/app/src/main/java/com/generalsx/zerohour/GeneralsOnlineSession.java
          ! grep -q "applyOnlineMode" android/app/src/main/java/com/generalsx/zerohour/ModManager.java
          ! grep -q "setup_card_online_mode" android/app/src/main/res/values/strings.xml
          ! grep -q "setup_card_reforged_mod" android/app/src/main/res/values/strings.xml
          ! grep -q "setup_reforged_wifi_prepare30" android/app/src/main/res/values/strings.xml
          grep -q "setup_reforged_wifi_state" android/app/src/main/res/values/strings.xml
          grep -q "GX_ENGINE_LIB" scripts/build/android/package-android-zh.sh
          grep -q "GX_REFORGEDX_LIB" scripts/build/android/package-android-zh.sh
          grep -q "GX_REFORGEDX_GAME_LIB" scripts/build/android/package-android-zh.sh
          grep -q "RfxGameActivity" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          test -f android/app/src/main/java/com/generalsx/zerohour/RfxGameActivity.java
          ! grep -q "GX_REFORGED60_LIB" scripts/build/android/package-android-zh.sh
          ! grep -q "GX_REFORGED_LIB" scripts/build/android/package-android-zh.sh
          grep -q "GX_OMIT_HOST_ENGINES" scripts/build/android/package-android-zh.sh
          test ! -f 'android/app/src/main/assets/reforged/!Reforged-v1.big'
          test ! -f 'android/app/src/main/assets/reforged/!ReforgedFixes-v3.big'
          test ! -f 'android/app/src/main/assets/reforged/!ReforgedBalance-v2.big'

      # v1.16, engine half: the second checkout takes the n60 patch
      # set ONLY (foundations with the GlobalData hunk excluded, the
      # hand anchor for that hunk, the flip, the derived Z60 stamp,
      # speed pacing) plus the packaging-script patch and the
      # data-path surgery in paths mode (phase 1b only -- its engine
      # binary carries the same hardcoded old-id data paths and must
      # resolve this app's files directory; its Java and resources
      # are never packaged). This tree builds the ONLY play engine
      # the APK ships. Purity is asserted below: no smooth-motion, no
      # resync, no Reforged lighting -- the retired lineage is absent.
      - name: Apply n60 patch set (engine tree)
        run: |
          set -euo pipefail
          ( cd reforged-src
            git apply --verbose ../reforged-overlay/ci/patches/60foundations.patch --exclude=GeneralsMD/Code/GameEngine/Source/Common/GlobalData.cpp
            git apply --verbose ../reforged-overlay/ci/patches/n60-globaldata-anchor.patch
            git apply --verbose ../reforged-overlay/ci/patches/60flip.patch
            git apply --verbose ../reforged-overlay/ci/patches/n60-stamp.patch
            git apply --verbose ../reforged-overlay/ci/patches/n60-pacing.patch
            git apply --verbose ../reforged-overlay/ci/patches/v117-engine.patch
            git apply --verbose ../reforged-overlay/ci/patches/package-android-zh-gradle-task.patch )
          REFORGED_SRC="${{ github.workspace }}/reforged-src" REFORGED_SURGERY_MODE=paths \
            python3 reforged-overlay/ci/apply-surgery.py
          # Verify the patches actually landed (fail loud, not silent):
          ! grep -q "smoothMotionCapture" reforged-src/Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DModelDraw.cpp
          ! grep -q "W3DSmoothMotion" reforged-src/GeneralsMD/Code/GameEngineDevice/Source/W3DDevice/GameClient/W3DDisplay.cpp
          ! grep -q "reforgeLighting" reforged-src/Core/GameEngineDevice/Source/W3DDevice/GameClient/WorldHeightMap.cpp
          ! grep -q "resyncOnCRCMismatch" reforged-src/GeneralsMD/Code/GameEngine/Source/GameLogic/System/GameLogic.cpp
          grep -q "ConvertRetailFrames" reforged-src/Core/GameEngine/Include/Common/GameCommon.h
          grep -q "retailFrictionToFrame" reforged-src/GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/PhysicsUpdate.cpp
          grep -q "parseRetailPerFrameReal" reforged-src/Core/GameEngine/Include/Common/INI.h
          grep -q "REFORGED_60_STEPS" reforged-src/cmake/config-build.cmake
          grep -q "REFORGED_60_STEPS" reforged-src/CMakeLists.txt
          grep -q "parseRetailFramesInt" reforged-src/GeneralsMD/Code/GameEngine/Source/Common/GlobalData.cpp
          grep -q "holdToRetailFireCycle" reforged-src/GeneralsMD/Code/GameEngine/Source/GameLogic/AI/AIStates.cpp
          grep -q "0x5A300000" reforged-src/GeneralsMD/Code/GameEngine/Source/Common/version.cpp
          grep -q '" Z60"' reforged-src/GeneralsMD/Code/GameEngine/Source/Common/version.cpp
          grep -q "m_frameRate = LOGICFRAMES_PER_SECOND" reforged-src/Core/GameEngine/Source/GameNetwork/Network.cpp
          # v1.17 landed: strike #1, the shell fixes and the test recorder:
          grep -q "const AsciiString scriptName" reforged-src/GeneralsMD/Code/GameEngine/Source/GameLogic/ScriptEngine/ScriptEngine.cpp
          grep -q "camStepMs" reforged-src/Core/GameEngineDevice/Source/W3DDevice/GameClient/W3DView.cpp
          grep -q "GXTestRecorder" reforged-src/GeneralsMD/Code/GameEngine/Source/Common/GameEngine.cpp
          grep -q "GXTestRecorder" reforged-src/Core/GameEngine/Source/GameNetwork/LANAPICallbacks.cpp
          # Phase 1b landed in this tree too (the paths-mode surgery's own
          # post-check already failed the run if any old-id path remains):
          grep -q "com.louay.zerohour.reforged" reforged-src/Core/GameEngine/Include/Common/GXLogging.h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Android SDK cache
        id: cache-android-sdk
        uses: actions/cache/restore@v4
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-p35-bt35

      - name: Install Android SDK (cmdline-tools + NDK + platform + build-tools)
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${{ env.CMDLINE_TOOLS_VERSION }}_latest.zip"
          echo "${{ env.CMDLINE_TOOLS_SHA1 }}  /tmp/cmdline-tools.zip" | sha1sum -c -
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          sudo chown -R "$(id -u):$(id -g)" /opt/android-sdk
          rm /tmp/cmdline-tools.zip
          SDKMANAGER=/opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;${{ env.NDK_VERSION }}" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Export Android SDK environment
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=/opt/android-sdk/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          test -f "/opt/android-sdk/ndk/${{ env.NDK_VERSION }}/build/cmake/android.toolchain.cmake" \
            || { echo "::error::NDK toolchain file missing after install"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install build tools (meson, ninja, pkg-config, glslang, ccache)
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq || sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends \
            ninja-build meson pkg-config glslang-tools ccache
          meson --version
          ninja --version
          glslangValidator --version | head -1
          ccache --version | head -1

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ env.PRESET }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-${{ env.PRESET }}-

      - name: Configure ccache
        run: |
          set -euo pipefail
          ccache --set-config=max_size=3G
          ccache --set-config=compiler_check=content
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Restore vcpkg cache
        id: cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/vcpkg
            ~/.cache/vcpkg
          key: vcpkg-android-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/triplets/arm64-android.cmake') }}
          restore-keys: |
            vcpkg-android-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Restore DXVK build cache
        id: cache-dxvk
        uses: actions/cache/restore@v4
        with:
          path: build/${{ env.PRESET }}/_deps/dxvk-build-android
          key: dxvk-android-${{ runner.os }}-${{ github.repository }}-${{ env.DXVK_REF }}-${{ hashFiles('Patches/dxvk-android.patch', 'Patches/dxvk-ios.patch', 'cmake/dx8.cmake', 'cmake/meson-arm64-android-cross.ini.in') }}

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [ ! -d /opt/vcpkg/.git ]; then
            git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg
          fi
          CURRENT="$(git -C /opt/vcpkg rev-parse HEAD || echo none)"
          if [ "$CURRENT" != "${{ env.VCPKG_COMMIT }}" ]; then
            git -C /opt/vcpkg fetch origin ${{ env.VCPKG_COMMIT }}
            git -C /opt/vcpkg checkout ${{ env.VCPKG_COMMIT }}
            rm -f /opt/vcpkg/vcpkg
          fi
          if [ ! -f /opt/vcpkg/vcpkg ]; then
            /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
          echo "VCPKG_ROOT=/opt/vcpkg" >> "$GITHUB_ENV"

      # The ALSOFT_BACKEND_*=OFF flags are the v1 build's openal-soft
      # configuration: desktop backends (PipeWire/Pulse/ALSA/...) are
      # Android-irrelevant and the cross-compile cannot use them; Android
      # plays through OpenSL. Everything else mirrors upstream + the local
      # build-apk.sh. v1.13: the base tree is configured ONCE, standard
      # (SAGE_HIGH_FPS_SIM=OFF) -- the host's 60 Hz pass is gone entirely;
      # this build's libmain.so/libgenerals.so are dependency staging
      # only and are never packaged (GX_OMIT_HOST_ENGINES).
      - name: Configure CMake (Android)
        run: |
          set -o pipefail
          mkdir -p logs
          cmake --preset ${{ env.PRESET }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DANDROID_CI_BUILD_NUMBER=${{ github.run_number }} \
            -DSAGE_HIGH_FPS_SIM=OFF \
            -DALSOFT_BACKEND_PIPEWIRE=OFF -DALSOFT_BACKEND_PULSEAUDIO=OFF -DALSOFT_BACKEND_ALSA=OFF \
            -DALSOFT_BACKEND_OSS=OFF -DALSOFT_BACKEND_SNDIO=OFF -DALSOFT_BACKEND_PORTAUDIO=OFF -DALSOFT_BACKEND_JACK=OFF \
            2>&1 | tee logs/configure_android.log
          # The base tree's only configure: standard engines, and the
          # Reforged flip does not exist in this tree at all.
          ! grep -q "^SAGE_HIGH_FPS_SIM:BOOL=ON" build/${{ env.PRESET }}/CMakeCache.txt
          ! grep -q "REFORGED_60_STEPS" build/${{ env.PRESET }}/CMakeCache.txt

      # Target list is the v1 local build's (build-apk.sh). Since v1.13
      # neither engine output is packaged -- the build exists because the
      # packaging script and the shared-library staging (DXVK, hooks,
      # SDL3, OpenAL, GameSpy) read this build tree.
      - name: Build engines (libmain.so + libgenerals.so) + DXVK + hooks
        run: |
          set -o pipefail
          mkdir -p logs
          cmake --build build/${{ env.PRESET }} --target z_generals g_generals dxvk_d3d8_install \
            main_hook file_redirect_hook gsl_alloc_hook hook_impl -- -k 0 2>&1 | tee logs/build_android.log
          ccache --show-stats

      # v1.16: THE engine, from the engine tree. reforged-src (the n60
      # patch set + phase-1b paths) is configured in its own build dir
      # with the flip ON and built once, z_generals only; its
      # libmain.so output ships as libmainz60.so, the only play engine
      # in the APK. There is no second pass: the v1.10-v1.15 standard
      # pass (libmainrf.so) is deleted with the engine it shipped.
      # No stash/restore dance (the v1.5-v1.8 Tree B shape) -- the
      # trees are separate checkouts, so the base tree's standard
      # libmain.so can never be confused with this one.
      - name: Build pure 60-steps engine (libmainz60.so)
        # v1.20: skipped (owner's order) -- no play engine in this build.
        if: ${{ false }}
        run: |
          set -o pipefail
          mkdir -p logs
          SRCRF="${GITHUB_WORKSPACE}/reforged-src"
          # Configure inside reforged-src ONLY (the preset resolves paths
          # from the working directory, like the main tree's configure);
          # the base tree's own configuration is never touched here.
          ( cd "${SRCRF}" && cmake --preset ${{ env.PRESET }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DANDROID_CI_BUILD_NUMBER=${{ github.run_number }} \
            -DREFORGED_60_STEPS=ON \
            -DALSOFT_BACKEND_PIPEWIRE=OFF -DALSOFT_BACKEND_PULSEAUDIO=OFF -DALSOFT_BACKEND_ALSA=OFF \
            -DALSOFT_BACKEND_OSS=OFF -DALSOFT_BACKEND_SNDIO=OFF -DALSOFT_BACKEND_PORTAUDIO=OFF -DALSOFT_BACKEND_JACK=OFF \
            2>&1 | tee "${GITHUB_WORKSPACE}/logs/configure_reforged.log" )
          # Print the cache state before asserting on it (self-diagnosing).
          grep "^REFORGED_60_STEPS:" "${SRCRF}/build/${{ env.PRESET }}/CMakeCache.txt" || echo "REFORGED_60_STEPS: (absent from CMakeCache.txt)"
          grep "^SAGE_HIGH_FPS_SIM:" "${SRCRF}/build/${{ env.PRESET }}/CMakeCache.txt" || echo "SAGE_HIGH_FPS_SIM: (absent from CMakeCache.txt)"
          grep -q "^REFORGED_60_STEPS:BOOL=ON" "${SRCRF}/build/${{ env.PRESET }}/CMakeCache.txt"
          ! grep -q "^SAGE_HIGH_FPS_SIM:BOOL=ON" "${SRCRF}/build/${{ env.PRESET }}/CMakeCache.txt"
          ( cd "${SRCRF}" && cmake --build build/${{ env.PRESET }} --target z_generals -- -k 0 2>&1 | tee "${GITHUB_WORKSPACE}/logs/build_reforged.log" )
          MAIN_SO="${SRCRF}/build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so"
          [ -f "$MAIN_SO" ] || { echo "::error::reforged z_generals output missing at $MAIN_SO"; exit 1; }
          READELF="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          [ -x "$READELF" ] || { echo "::error::llvm-readelf not found under ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"; exit 1; }
          # Post-build evidence (run #9 lesson): every check captures
          # output first, greps the capture, and PRINTS the evidence
          # before it is allowed to fail; the architecture check retries,
          # like "Verify artifacts".
          ls -la "$MAIN_SO"
          OK=0
          for attempt in 1 2 3 4 5; do
            if HDR="$("$READELF" -h "$MAIN_SO" 2>&1)" && echo "$HDR" | grep -E "Machine:.*AArch64"; then OK=1; break; fi
            echo "readelf attempt ${attempt} did not confirm AArch64; full output was:"
            echo "$HDR"
            sleep 1
          done
          [ "$OK" = "1" ] || { echo "::error::libmainz60 build is not AArch64 (see the ELF headers printed above)"; exit 1; }
          # The Z60 version stamp must be compiled in (the same-build
          # refusal for saves, replays and LAN lobbies depends on it),
          # and NOTHING of the retired engines may be compiled in with
          # it: no RF60 stamp, no smooth-motion layer, no resync heal.
          # The compiled-in GeneralsOnline client id must be the 30 Hz
          # one and ONLY that one: this engine is not a HIGH_FPS build,
          # and the launcher's clientId() announces CLIENT_ID for
          # exactly the states where this library loads -- the two must
          # agree (v1.9 record 9.4).
          strings "$MAIN_SO" > "${RUNNER_TEMP}/z60-strings.txt"
          grep " Z60" "${RUNNER_TEMP}/z60-strings.txt" | head -3 || true
          grep -q " Z60" "${RUNNER_TEMP}/z60-strings.txt" || { echo "::error::Z60 stamp missing from the pure 60-steps build"; exit 1; }
          if grep -q " RF60" "${RUNNER_TEMP}/z60-strings.txt"; then
            echo "::error::RF60 stamp found in the pure build -- retired-engine code leaked in"; exit 1
          fi
          if grep -q "smoothMotionCapture" "${RUNNER_TEMP}/z60-strings.txt"; then
            echo "::error::smoothMotionCapture found in the pure build -- Reforged additions leaked in"; exit 1
          fi
          if grep -q "resyncOnCRCMismatch" "${RUNNER_TEMP}/z60-strings.txt"; then
            echo "::error::resync strings found in the pure build -- the heal layer leaked in"; exit 1
          fi
          grep -o "gen_online_[0-9]*hz" "${RUNNER_TEMP}/z60-strings.txt" | sort | uniq -c || true
          grep -q "gen_online_30hz" "${RUNNER_TEMP}/z60-strings.txt" || { echo "::error::libmainz60.so lacks the gen_online_30hz client id"; exit 1; }
          if grep -q "gen_online_60hz" "${RUNNER_TEMP}/z60-strings.txt"; then
            echo "::error::gen_online_60hz found in libmainz60.so -- the flip tree took the HIGH_FPS define"; exit 1
          fi
          cp "$MAIN_SO" "${GITHUB_WORKSPACE}/libmainz60.so"
          ls -la "${GITHUB_WORKSPACE}/libmainz60.so"
          ccache --show-stats

      # (v1.16: no second engine pass exists. The v1.10-v1.15 standard
      # pass that shipped libmainrf.so was deleted with that engine.)

      - name: Verify artifacts
        run: |
          set -euo pipefail
          READELF="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          [ -x "$READELF" ] || { echo "::error::llvm-readelf not found under ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"; exit 1; }
          for lib in "build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so" \
                     "build/${{ env.PRESET }}/Generals/Code/Main/libgenerals.so"; do
            [ -f "$lib" ] || { echo "::error::$lib not found"; exit 1; }
            OK=0
            for attempt in 1 2 3 4 5; do
              # Capture first, grep the capture (run #9 lesson): the old
              # `readelf 2>/dev/null | grep -q` form discarded readelf's
              # stderr and its header alike, so a failure explained
              # nothing. A failed attempt now prints the full output.
              if HDR="$("$READELF" -h "$lib" 2>&1)" && echo "$HDR" | grep -qE "Machine:.*AArch64"; then OK=1; break; fi
              echo "readelf attempt ${attempt} on $lib did not confirm AArch64; full output was:"
              echo "$HDR"
              sleep 1
            done
            if [ "$OK" != "1" ]; then
              ls -la "$lib"
              echo "::error::$lib is not AArch64 (see the ELF headers printed above)"
              exit 1
            fi
          done
          # v1.20: the pure 60-steps engine is not built in this line
          # (owner's order), so there is no staged libmainz60.so to verify.
          for lib in libdxvk_d3d8.so libdxvk_d3d9.so; do
            [ -f "build/${{ env.PRESET }}/$lib" ] || { echo "::error::$lib missing"; exit 1; }
          done
          strings "build/${{ env.PRESET }}/libdxvk_d3d9.so" | grep -q "SDL3 WSI:" || {
            echo "::error::libdxvk_d3d9.so built without SDL3 WSI"; exit 1; }
          echo "Artifacts verified: DXVK with SDL3 WSI; base libmain.so + libgenerals.so built for dependency staging only (not packaged). v1.20: no play engine is built or packaged."

      # Symbol table of the unstripped shipped play engine
      # (libmainz60.so), kept so crash logs from this build can be
      # symbolized later (a few MB of text; the library itself is far
      # too big to archive).
      - name: Collect symbol table (before stripping)
        # v1.20: skipped -- libmainz60.so is not built in this line.
        if: ${{ false }}
        run: |
          set -e
          TOOLS="$(dirname "$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-nm | head -1)")"
          mkdir -p symbols
          # The play engine's unstripped copy sits at the workspace
          # root, staged by the engine step above.
          LIB60="${GITHUB_WORKSPACE}/libmainz60.so"
          OUT60="symbols/libmainz60-run${{ github.run_number }}.symbols.txt"
          BUILD_ID60="$(readelf -n "$LIB60" 2>/dev/null | sed -n 's/.*Build ID: \([0-9a-f]*\).*/\1/p' | head -1)"
          {
            echo "# libmainz60.so symbols -- run ${{ github.run_number }}, commit ${{ github.sha }}"
            echo "# BuildID: ${BUILD_ID60:-UNKNOWN}"
            "$TOOLS/llvm-readelf" --notes --program-headers "$LIB60"
            echo "# --- defined symbols: address size type name ---"
            "$TOOLS/llvm-nm" --defined-only --numeric-sort --print-size --demangle "$LIB60"
          } > "$OUT60"
          gzip -9 "$OUT60"
          ls -la symbols/

      # Strip list is the v1 local build's (build-apk.sh): upstream's list
      # plus libgenerals.so. DXVK libraries are deliberately NOT stripped
      # (see android/app/build.gradle keepDebugSymbols).
      # v1.15: the Stage C3 test payload -- the upstream Reforged
      # engine's frame selfcheck + offscreen phase, built exactly the
      # C1/C2-proven way (probe workflow's renderer route) and shipped
      # as libmainrfx.so. Only the launcher's tests page loads it, in
      # its own process; the game never does.
      - name: Build Reforged C3 test payload (libmainrfx.so)
        run: |
          set -euo pipefail
          SRC="$PWD/reforged-engine"
          git -C "$SRC" apply --check "$PWD/reforged-overlay/probe/patches/reforged-c1-android.patch"
          git -C "$SRC" apply "$PWD/reforged-overlay/probe/patches/reforged-c1-android.patch"
          git -C "$SRC" apply --check "$PWD/reforged-overlay/probe/patches/reforged-frame-selfcheck-entry.patch"
          git -C "$SRC" apply "$PWD/reforged-overlay/probe/patches/reforged-frame-selfcheck-entry.patch"
          test -f "$SRC/GeneralsMD/Code/Tests/frame_selfcheck_main.cpp"
          grep -q "C3 OFFSCREEN-VERDICT" "$SRC/GeneralsMD/Code/Tests/frame_selfcheck_main.cpp"
          bash "$SRC/GeneralsMD/Code/Tools/vendor.sh"
          git -C "$SRC" apply --check "$PWD/reforged-overlay/probe/patches/reforged-rfx-jni-prefix.patch"
          git -C "$SRC" apply "$PWD/reforged-overlay/probe/patches/reforged-rfx-jni-prefix.patch"
          grep -q "org_libsdl_apprfx" "$SRC/GeneralsMD/Code/Libraries/Source/SDL3/src/core/android/SDL_android.c"
          GS="$SRC/GeneralsMD/Code/Libraries/Source/GameSpy"
          test -f "$GS/src/common/linux/gsthreadlinux.c"
          GIT_CEILING_DIRECTORIES="$SRC/GeneralsMD/Code/Libraries/Source" git -C "$GS" -c core.autocrlf=false apply "$PWD/reforged-overlay/probe/patches/gamespy-android-pthread.patch"
          grep -q "bionic has no pthread_cancel" "$GS/src/common/linux/gsthreadlinux.c"
          mkdir -p "$PWD/host-tools"
          c++ -O2 -std=c++17 "$SRC/GeneralsMD/Code/Tools/fingerprint/build_fingerprint.cpp" -o "$PWD/host-tools/build_fingerprint"
          export PATH="$PWD/host-tools:$PATH"
          cmake -S "$SRC/GeneralsMD/Code" -B "$PWD/rfx-build" -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$PWD/rfx-build" --target sdl_gpu_frame_selfcheck -j"$(nproc)"
          cp "$PWD/rfx-build/libsdl_gpu_frame_selfcheck.so" "${GITHUB_WORKSPACE}/libmainrfx.so"
          NM="$(ls "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-nm | head -1)"
          "$NM" -D "${GITHUB_WORKSPACE}/libmainrfx.so" > "${RUNNER_TEMP}/rfx-dynsym.txt"
          grep -q " T SDL_main" "${RUNNER_TEMP}/rfx-dynsym.txt"
          strings "${GITHUB_WORKSPACE}/libmainrfx.so" > "${RUNNER_TEMP}/rfx-strings.txt"
          grep -q "C3 OFFSCREEN-VERDICT" "${RUNNER_TEMP}/rfx-strings.txt"
          grep -q "frame-capture.bmp" "${RUNNER_TEMP}/rfx-strings.txt"
          grep -q "org/libsdl/apprfx/SDLActivity" "${RUNNER_TEMP}/rfx-strings.txt"
          ! grep -q "org/libsdl/app/SDLActivity" "${RUNNER_TEMP}/rfx-strings.txt"
          ls -la "${GITHUB_WORKSPACE}/libmainrfx.so"
          # v1.18: the Stage C4 game library -- the full Reforged game
          # as libmainrfxgame.so, built in this same tree (C1 + the
          # frame-entry patch already applied) with the C4 CMake patch
          # (rfx_game target + the FFmpeg target-arch/triple fix + the
          # GameSpy PIC force). Locally proven 2026-11-19: the whole
          # game compiles and links, SDL_main exported.
          git -C "$SRC" apply --check "$PWD/reforged-overlay/probe/patches/reforged-c4-game-library.patch"
          git -C "$SRC" apply "$PWD/reforged-overlay/probe/patches/reforged-c4-game-library.patch"
          grep -q "add_library(rfx_game SHARED" "$SRC/GeneralsMD/Code/CMakeLists.txt"
          grep -q "zh_c4_force_pic" "$SRC/GeneralsMD/Code/CMakeLists.txt"
          cmake --build "$PWD/rfx-build" --target rfx_game -j"$(nproc)"
          cp "$PWD/rfx-build/librfx_game.so" "${GITHUB_WORKSPACE}/libmainrfxgame.so"
          "$NM" -D "${GITHUB_WORKSPACE}/libmainrfxgame.so" > "${RUNNER_TEMP}/rfxgame-dynsym.txt"
          grep -q " T SDL_main" "${RUNNER_TEMP}/rfxgame-dynsym.txt"
          strings "${GITHUB_WORKSPACE}/libmainrfxgame.so" > "${RUNNER_TEMP}/rfxgame-strings.txt"
          grep -q "org/libsdl/apprfx/SDLActivity" "${RUNNER_TEMP}/rfxgame-strings.txt"
          ! grep -q "org/libsdl/app/SDLActivity" "${RUNNER_TEMP}/rfxgame-strings.txt"
          ls -la "${GITHUB_WORKSPACE}/libmainrfxgame.so"

      # v1.15.2: stage the payload's own SDL 3.4.16 Java layer under
      # the renamed package org.libsdl.apprfx (see ci/stage-rfx-glue.py
      # for why the host's 3.4.2 layer must never run the payload).
      # Runs after the payload build because the glue source is the
      # vendored SDL tree vendor.sh produced inside reforged-engine.
      - name: Stage RFX SDL glue (isolated 3.4.16 Java layer)
        run: |
          set -euo pipefail
          GX_GLUE_SRC="$PWD/reforged-engine/GeneralsMD/Code/Libraries/Source/SDL3/android-project/app/src/main/java/org/libsdl/app" \
          GX_APP_JAVA="$PWD/android/app/src/main/java" \
          GX_GLUE_SDL_ACTIVITY_OVERRIDE="$PWD/reforged-overlay/ci/glue/SDLActivity-gesture-3416.java" \
            python3 reforged-overlay/ci/stage-rfx-glue.py
          test -f android/app/src/main/java/org/libsdl/apprfx/SDLActivity.java
          grep -q "package org.libsdl.apprfx;" android/app/src/main/java/org/libsdl/apprfx/SDLActivity.java
          grep -q "EdgeBackGestureHandler" android/app/src/main/java/org/libsdl/apprfx/SDLActivity.java

      # Symbol table of the unstripped C4 game library, same reason
      # as the play engine's: device crash logs from the tests page
      # can only be symbolized with it. Runs after the payload step
      # (which stages the library at the workspace root) and before
      # the strip step below.
      - name: Collect C4 symbol table (before stripping)
        run: |
          set -e
          TOOLS="$(dirname "$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-nm | head -1)")"
          mkdir -p symbols
          LIBG="${GITHUB_WORKSPACE}/libmainrfxgame.so"
          [ -f "$LIBG" ] || { echo "::error::libmainrfxgame.so missing at symbol collection (C4 staging lost)"; exit 1; }
          OUTG="symbols/libmainrfxgame-run${{ github.run_number }}.symbols.txt"
          BUILD_IDG="$(readelf -n "$LIBG" 2>/dev/null | sed -n 's/.*Build ID: \([0-9a-f]*\).*/\1/p' | head -1)"
          {
            echo "# libmainrfxgame.so symbols -- run ${{ github.run_number }}, commit ${{ github.sha }}"
            echo "# BuildID: ${BUILD_IDG:-UNKNOWN}"
            "$TOOLS/llvm-readelf" --notes --program-headers "$LIBG"
            echo "# --- defined symbols: address size type name ---"
            "$TOOLS/llvm-nm" --defined-only --numeric-sort --print-size --demangle "$LIBG"
          } > "$OUTG"
          gzip -9 "$OUTG"
          ls -la symbols/

      - name: Strip debug symbols
        run: |
          STRIP="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-strip | head -1)"
          for lib in "build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so" \
                     "build/${{ env.PRESET }}/Generals/Code/Main/libgenerals.so" \
                     "build/${{ env.PRESET }}/_deps/sdl3-build/libSDL3.so" \
                     "build/${{ env.PRESET }}/_deps/sdl3_image-build/libSDL3_image.so" \
                     "build/${{ env.PRESET }}/_deps/openal_soft-build/libopenal.so" \
                     "build/${{ env.PRESET }}/libgamespy.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/libadrenotools.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libgsl_alloc_hook.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libhook_impl.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libmain_hook.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libfile_redirect_hook.so"; do
            [ -f "$lib" ] && "$STRIP" --strip-unneeded "$lib"
          done
          # v1.20: no 60-steps engine is packaged in this build, so
          # there is no workspace libmainz60.so to strip.
          # The C3 test payload's packaged copy, same discipline.
          [ -f "${GITHUB_WORKSPACE}/libmainrfx.so" ] || { echo "::error::libmainrfx.so missing at strip time (C3 payload staging lost)"; exit 1; }
          "$STRIP" --strip-unneeded "${GITHUB_WORKSPACE}/libmainrfx.so"
          # The C4 game library's packaged copy, same discipline.
          [ -f "${GITHUB_WORKSPACE}/libmainrfxgame.so" ] || { echo "::error::libmainrfxgame.so missing at strip time (C4 game staging lost)"; exit 1; }
          "$STRIP" --strip-unneeded "${GITHUB_WORKSPACE}/libmainrfxgame.so"

      # v1.22: the Reforged engine's own data layer (its *Reforged.ini
      # set, cursors, scripts, window files, HUD textures) ships
      # upstream as an overlay directory (PosixMain -overlay, the
      # fork's P1 decision 9). Stage it with the fork's own script --
      # Run folder empty, so no 1.65 GB art archives are linked; the
      # fork's own macOS app ships without them too -- zip it, and
      # drop it into the app assets. RfxGameActivity extracts it on
      # first launch and passes -overlay to the engine.
      - name: Stage the fork's data overlay (v1.22 + v1.23 fonts)
        run: |
          set -euo pipefail
          bash reforged-engine/GeneralsMD/Code/Tools/stage-overlay.sh \
            reforged-engine/GeneralsMD/Code/Data "" \
            "$GITHUB_WORKSPACE/rfx-overlay-out"
          # v1.23: the Liberation faces, renamed to the Windows names as
          # the host port stages them, ride the overlay root at fonts/ so
          # the engine's font resolver finds them before the install.
          mkdir -p "$GITHUB_WORKSPACE/rfx-overlay-out/fonts"
          cp reforged-overlay/ci/fonts/arial.ttf reforged-overlay/ci/fonts/arialbold.ttf reforged-overlay/ci/fonts/couriernew.ttf reforged-overlay/ci/fonts/timesnewroman.ttf reforged-overlay/ci/fonts/LICENSE "$GITHUB_WORKSPACE/rfx-overlay-out/fonts/"
          (cd "$GITHUB_WORKSPACE/rfx-overlay-out" && zip -r -q "$GITHUB_WORKSPACE/rfx-overlay.zip" .)
          mkdir -p android/app/src/main/assets
          cp "$GITHUB_WORKSPACE/rfx-overlay.zip" android/app/src/main/assets/rfx-overlay.zip
          unzip -l android/app/src/main/assets/rfx-overlay.zip | grep -q "Data/INI/ScienceReforged.ini"
          unzip -l android/app/src/main/assets/rfx-overlay.zip | grep -q "fonts/arial.ttf"
          ls -la android/app/src/main/assets/rfx-overlay.zip

      # GX_GRADLE_TASK is the overlay patch's knob: the packaging script
      # stages jniLibs/assets, then runs assembleRelease instead of its
      # default assembleDebug, and its final check looks at the release
      # output path. The release output is signed with the project's own
      # committed debug keystore (project config) -- re-signing with the
      # dedicated release keystore happens locally, never in CI.
      - name: Package APK (release)
        env:
          GX_ANDROID_STAGING: ${{ github.workspace }}/android-staging
          GX_GRADLE_TASK: assembleRelease
          # v1.20 (owner's order): EMPTY -- the packaging script skips
          # the play-engine copy when GX_ENGINE_LIB is empty; this build
          # ships the Reforged test payload only, no play engine.
          GX_ENGINE_LIB: ""
          GX_REFORGEDX_LIB: ${{ github.workspace }}/libmainrfx.so
          GX_REFORGEDX_GAME_LIB: ${{ github.workspace }}/libmainrfxgame.so
          # v1.16: the host's engines are NOT packaged. The packaging
          # script still stages the shared libraries from the base tree,
          # but this knob (our gradle-task patch) keeps libmain.so and
          # libgenerals.so out of jniLibs -- only the one play engine
          # above (plus the tests payload) enters the APK.
          GX_OMIT_HOST_ENGINES: "1"
          GX_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          GX_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          ./scripts/build/android/package-android-zh.sh

      - name: Locate APK
        id: locate
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then echo "::error::APK not found at $APK"; exit 1; fi
          cp "$APK" "ZeroHourReforged.apk"
          ls -la "ZeroHourReforged.apk"
          echo "path=ZeroHourReforged.apk" >> "$GITHUB_OUTPUT"

      # v1.22: the shipped APK must carry the data overlay asset,
      # and the overlay's INIs must keep their CRLF endings (the
      # multiplayer INI CRC reads each line with its carriage
      # return; stage-overlay.sh guarantees this, verify it here).
      - name: Verify APK carries the data overlay (v1.22 + v1.23 fonts)
        run: |
          set -euo pipefail
          unzip -l ZeroHourReforged.apk | grep -q "assets/rfx-overlay.zip"
          unzip -p ZeroHourReforged.apk assets/rfx-overlay.zip > /tmp/rfx-overlay.zip
          unzip -l /tmp/rfx-overlay.zip | grep -q "Data/INI/ScienceReforged.ini"
          unzip -l /tmp/rfx-overlay.zip | grep -q "Data/Scripts/SkirmishScripts.scb"
          unzip -l /tmp/rfx-overlay.zip | grep -q "fonts/arial.ttf"
          unzip -l /tmp/rfx-overlay.zip | grep -q "fonts/arialbold.ttf"
          unzip -p /tmp/rfx-overlay.zip Data/INI/ScienceReforged.ini > /tmp/sci.ini
          grep -q $'\r' /tmp/sci.ini || { echo "::error::ScienceReforged.ini lost its CRLF endings"; exit 1; }
          echo "overlay asset verified in APK"


      # Every non-system DT_NEEDED of the shipped engines must be inside the APK, or
      # the build would crash with dlopen failed on a real device (upstream
      # CI check, adapted to the v1.16 engine set).
      - name: Verify APK contains every library the shipped engines need
        run: |
          set -euo pipefail
          READELF="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          [ -x "$READELF" ] || { echo "::error::llvm-readelf not found under ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"; exit 1; }
          APK="${{ steps.locate.outputs.path }}"
          WORKDIR="$(mktemp -d)"
          unzip -q "${APK}" 'lib/arm64-v8a/*' -d "${WORKDIR}"
          echo "Packaged libraries:"
          ls "${WORKDIR}/lib/arm64-v8a/"
          # Engine set, exactly (v1.20): the Reforged tests payload
          # only -- NO play engine (owner's order, 2026-11-19). The
          # host's libraries, the retired Reforged engines AND the
          # 60-steps engine are forbidden outright -- any one of them
          # in the APK fails the build -- and the *60.so set is empty.
          for required in libmainrfx.so libmainrfxgame.so; do
            if [ ! -f "${WORKDIR}/lib/arm64-v8a/${required}" ]; then
              echo "::error::required engine library ${required} is missing from the APK"
              exit 1
            fi
          done
          for forbidden in libmain.so libmain60.so libgenerals.so libgenerals60.so libmainrf.so libmainrf60.so libmainz60.so libEGL_angle.so libGLESv2_angle.so libadrenotools.so libdxvk_d3d8.so libdxvk_d3d9.so libfile_redirect_hook.so libgamespy.so libgsl_alloc_hook.so libhook_impl.so libmain_hook.so libopenal.so libSDL3.so libSDL3_image.so libc++_shared.so; do
            if [ -f "${WORKDIR}/lib/arm64-v8a/${forbidden}" ]; then
              echo "::error::forbidden engine library ${forbidden} is packaged in the APK -- v1.20 ships the Reforged payload only (libmainrfx.so + libmainrfxgame.so), no play engine"
              exit 1
            fi
          done
          for forbidden_asset in "assets/default_driver/" "assets/gamedata/dxvk.conf"; do
            if unzip -l "${APK}" | grep -q "${forbidden_asset}"; then
              echo "::error::forbidden old-engine asset ${forbidden_asset} is packaged in the APK (v1.24.1 purge)"
              exit 1
            fi
          done
          SIXTY="$(ls "${WORKDIR}/lib/arm64-v8a/" | grep -E '^lib.*60\.so$' || true)"
          if [ -n "${SIXTY}" ]; then
            echo "::error::unexpected *60.so in the APK: '${SIXTY}' (v1.20 packages no 60-steps engine at all)"
            exit 1
          fi
          missing=0
          for engine in libmainrfxgame.so; do
            NEEDED="$("${READELF}" -d "${WORKDIR}/lib/arm64-v8a/${engine}" | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/')"
            for lib in ${NEEDED}; do
              case "${lib}" in
                libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libGLESv*|libEGL.so|libvulkan.so|libOpenSLES.so|libaaudio.so|libmediandk.so|libcamera2ndk.so|libjnigraphics.so|libnativewindow.so|libsync.so|libz.so)
                  continue ;;
              esac
              if [ ! -f "${WORKDIR}/lib/arm64-v8a/${lib}" ]; then
                echo "::error::${engine} needs '${lib}' at runtime but it is not packaged in the APK"
                missing=1
              fi
            done
          done
          rm -rf "${WORKDIR}"
          if [ "${missing}" -ne 0 ]; then
            echo "::error::APK is missing required native libraries."
            exit 1
          fi
          echo "OK: engine set exact (libmainz60.so + libmainrfx.so + libmainrfxgame.so), and every DT_NEEDED of the play engine and the C4 game library is present in the APK."

      # v1.17 (owner's order, wave-8 record §156): the account-wide
      # Actions artifact quota is exhausted, so the build is delivered
      # as a GitHub Release asset on this repo instead of an artifact.
      # A download channel for test builds only -- the official signed
      # launch still waits for the owner's word.
      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          # The workspace root is the MYSOREZ checkout (the first one
          # without a path), so gh would resolve THAT repo from the git
          # remote -- run #30 died on exactly that (403 on
          # MYSOREZ/GeneralsZH-Android-Port/releases). Pin ours.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VER="${{ inputs.version_name }}"
          if [ -z "$VER" ]; then VER="build-${{ github.run_number }}"; fi
          TAG="v$VER"
          APK="${{ steps.locate.outputs.path }}"
          [ -f "$APK" ] || { echo "::error::APK not found at $APK"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Zero Hour Reforged $TAG (test build)" \
              --notes "Test build $TAG, delivered as a Release asset because the Actions artifact quota is exhausted. Not the official signed launch."
          fi
          echo "APK published as release asset: $TAG"

      - name: Attach symbol tables to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VER="${{ inputs.version_name }}"
          if [ -z "$VER" ]; then VER="build-${{ github.run_number }}"; fi
          TAG="v$VER"
          if [ -d symbols ]; then
            find symbols -type f -print0 | xargs -0 --no-run-if-empty gh release upload "$TAG" --clobber
          fi

      # Save caches even when the job failed (upstream discipline: a failed
      # run must not force the next one to rebuild ffmpeg/openssl/DXVK from
      # scratch). Guard each save so an exact-key restore hit doesn't fail.
      - name: Save Android SDK cache
        if: always() && steps.cache-android-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-p35-bt35

      - name: Save vcpkg cache
        if: always() && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /opt/vcpkg
            ~/.cache/vcpkg
          key: vcpkg-android-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/triplets/arm64-android.cmake') }}

      - name: Save DXVK build cache
        if: always() && steps.cache-dxvk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/${{ env.PRESET }}/_deps/dxvk-build-android
          key: dxvk-android-${{ runner.os }}-${{ github.repository }}-${{ env.DXVK_REF }}-${{ hashFiles('Patches/dxvk-android.patch', 'Patches/dxvk-ios.patch', 'cmake/dx8.cmake', 'cmake/meson-arm64-android-cross.ini.in') }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ env.PRESET }}-${{ github.run_id }}
