name: Build Zero Hour Reforged APK

# Zero Hour Reforged CI: builds the Reforged APK from the PUBLIC upstream
# MYSOREZ/GeneralsZH-Android-Port tree (pinned commit) plus this repo's
# overlay (ci/): the engine patches, the package-id surgery scripts, and
# the bundled merged Reforged data package. Nothing of the multi-GB
# engine tree lives in this repo -- it is checked out fresh from upstream
# on every run and the overlay is applied on top.
#
# v1.13 (owner order 2026-11-12, superseding the v1.9 separation and
# the v1.10 six-engine build): OURS ALONE. The host's engines no longer
# ship -- the APK carries exactly two engines, libmainrf.so (standard)
# and libmainrf60.so (60-steps), both from the patched Reforged tree
# (reforged-src), chosen on the Reforged page by the 60-steps switch
# (pref reforged_60_steps, default OFF). The base tree is build
# scaffolding only: identity surgery (package id, native data paths,
# label, update channel) plus our launcher page; its standard engines
# are still built because the packaging script and the shared-library
# staging (SDL3, OpenAL, GameSpy, DXVK, hooks) read that build tree --
# but the packaging script's GX_OMIT_HOST_ENGINES knob keeps libmain.so
# and libgenerals.so out of the APK, and their 60 Hz pass is not built
# at all. The bundled Reforged data is core app data, forced on by
# phase 2 at every launcher start (no mod switch anywhere). The
# shell's Generals side is sealed (getSelectedGame always answers Zero
# Hour) and GeneralsOnline is not reachable from this app -- the
# owner's original MYSOREZ app remains installed for that.
# Signing stays LOCAL (project decision): this workflow's artifact is the
# AGP release output, debug-signed by the project's own config -- exactly
# the pre-signing state of the local v1 build. The owner re-signs the
# artifact with the dedicated keystore before publishing a Release.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version_name:
        type: string
        description: "Override versionName (blank = build.gradle default, currently '1.14'). Bump together with version_code for a new release."
        default: ""
      version_code:
        type: string
        description: "Override versionCode (blank = build.gradle default, currently 15). Must increase between published releases."
        default: ""

env:
  PRESET: android-vulkan
  # Pinned upstream commit the overlay was extracted and verified against
  # (the v1 local build tree). Bump only with a re-extracted overlay.
  MYSOREZ_REF: a520ed1b693f18fd1404d2cc85b33ba041b52523
  # Toolchain pins, identical to upstream's own build-android.yml.
  NDK_VERSION: "27.2.12479018"
  GRADLE_VERSION: "8.9"
  CMDLINE_TOOLS_VERSION: "13114758"
  CMDLINE_TOOLS_SHA1: "5fdcc763663eefb86a5b8879697aa6088b041e70"
  VCPKG_COMMIT: "42e4e33e1505c9f47b58c21e0f557c1571b751ee"

jobs:
  build-apk:
    name: ZeroHourReforged-apk
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout MYSOREZ port (pinned)
        uses: actions/checkout@v4
        with:
          repository: MYSOREZ/GeneralsZH-Android-Port
          ref: ${{ env.MYSOREZ_REF }}
          fetch-depth: 0
          submodules: false

      - name: Checkout Reforged overlay (this repo)
        uses: actions/checkout@v4
        with:
          path: reforged-overlay

      - name: Checkout DXVK fork submodule
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 references/fbraz3-dxvk
          # DXVK's OWN submodules (SPIRV-Headers, Vulkan-Headers,
          # libdisplay-info) — meson dies without them; the superproject
          # init above is not recursive.
          git -C references/fbraz3-dxvk submodule update --init --depth 1
          echo "DXVK_REF=$(git rev-parse HEAD:references/fbraz3-dxvk)" >> "$GITHUB_ENV"

      # The second checkout is OURS -- the Reforged engine tree. It
      # takes all ten engine patches plus the data-path surgery (phase 1b
      # only) and is built twice: with the 60-steps flip ON, its
      # z_generals output shipping as libmainrf60.so, and with the flip
      # OFF, its z_generals output shipping as libmainrf.so. Since v1.13
      # these are the only two engines the APK ships.
      - name: Checkout Reforged engine tree (patched)
        uses: actions/checkout@v4
        with:
          repository: MYSOREZ/GeneralsZH-Android-Port
          ref: ${{ env.MYSOREZ_REF }}
          path: reforged-src
          fetch-depth: 0
          submodules: false

      - name: Checkout DXVK fork submodule (Reforged tree)
        run: |
          set -euo pipefail
          git -C reforged-src submodule update --init --depth 1 references/fbraz3-dxvk
          git -C reforged-src/references/fbraz3-dxvk submodule update --init --depth 1

      # v1.13, base half: the main tree gets identity surgery
      # (phases 1a-1d), the Reforged page (phase 1e) and the bundled-data
      # phase -- and NO engine patch. ONE build-tooling exception: the
      # packaging-script patch also applies here, because the packaging
      # step runs this tree's script and the pristine script cannot
      # package this build at all (no release-task knob, no staging knobs
      # for libmainrf60.so / libmainrf.so, no GX_OMIT_HOST_ENGINES knob).
      # The script is build tooling -- it ships nothing and touches no
      # engine or launcher code. v1.13 launcher facts asserted below:
      # the Reforged page carries the single 60-steps switch (the
      # enhanced-30 switch and the mod card are GONE), the Simulation
      # Rate section is never built (its method remains, uncalled), the
      # deleted Online Mode is absent, and the bundled data has no
      # enable switch anywhere (phase 2 forces it on).
      - name: Apply identity surgery + Reforged page (base tree)
        run: |
          set -euo pipefail
          git apply --verbose reforged-overlay/ci/patches/package-android-zh-gradle-task.patch
          # Package-id surgery + bundled-data phase (both scripts resolve
          # the MYSOREZ tree as the parent of the overlay checkout).
          python3 reforged-overlay/ci/apply-surgery.py
          python3 reforged-overlay/ci/apply-phase2.py
          # Verify the overlay actually landed (fail loud, not silent):
          grep -q "applicationId 'com.louay.zerohour.reforged'" android/app/build.gradle
          grep -q "reforged_60_steps" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          ! grep -q "reforged_enhanced_30" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          ! grep -q "buildReforgedModCard" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          grep -q "TAB_REFORGED" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          grep -q "buildReforgedPage" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          grep -q "buildSimRateSection" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          ! grep -q "buildSimRateSection(page);" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          grep -q "setup_card_reforged_wifi" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          grep -q "mainrf60" android/app/src/main/java/com/generalsx/zerohour/GeneralsZHActivity.java
          grep -q '"mainrf"' android/app/src/main/java/com/generalsx/zerohour/GeneralsZHActivity.java
          grep -q "CLIENT_ID" android/app/src/main/java/com/generalsx/zerohour/GeneralsOnlineSession.java
          grep -q "ensureBundledReforgedData" android/app/src/main/java/com/generalsx/zerohour/ModManager.java
          grep -q "migrateOnlineModeState" android/app/src/main/java/com/generalsx/zerohour/ModManager.java
          ! grep -q "bundledModEnabled" android/app/src/main/java/com/generalsx/zerohour/ModManager.java
          # The UpdateManager engine-override load path is REMOVED by
          # surgery (kept from v1.8) -- its entry points must be absent
          # from the launcher activity (the APK's engines are the only
          # engines).
          ! grep -q "activeEngineLibrary" android/app/src/main/java/com/generalsx/zerohour/GeneralsZHActivity.java
          ! grep -q "activeEngineSeq" android/app/src/main/java/com/generalsx/zerohour/GeneralsZHActivity.java
          # v1.9: the deleted Online Mode leaves no trace in the base
          # launcher -- no accessors, no card, no strings. (ModManager
          # legitimately names the legacy prefs inside its migration;
          # it is not greped here.)
          ! grep -q "getOnlineMode" android/app/src/main/java/com/generalsx/zerohour/SetupActivity.java
          ! grep -q "getOnlineMode" android/app/src/main/java/com/generalsx/zerohour/GeneralsZHActivity.java
          ! grep -q "getOnlineMode" android/app/src/main/java/com/generalsx/zerohour/GeneralsOnlineSession.java
          ! grep -q "applyOnlineMode" android/app/src/main/java/com/generalsx/zerohour/ModManager.java
          ! grep -q "setup_card_online_mode" android/app/src/main/res/values/strings.xml
          ! grep -q "setup_card_reforged_mod" android/app/src/main/res/values/strings.xml
          grep -q "setup_reforged_wifi_prepare30" android/app/src/main/res/values/strings.xml
          grep -q "GX_REFORGED60_LIB" scripts/build/android/package-android-zh.sh
          grep -q "GX_REFORGED_LIB" scripts/build/android/package-android-zh.sh
          grep -q "GX_OMIT_HOST_ENGINES" scripts/build/android/package-android-zh.sh
          test -f 'android/app/src/main/assets/reforged/!Reforged-v1.big'
          test ! -f 'android/app/src/main/assets/reforged/!ReforgedFixes-v3.big'
          test ! -f 'android/app/src/main/assets/reforged/!ReforgedBalance-v2.big'
          sha256sum 'android/app/src/main/assets/reforged/!Reforged-v1.big'

      # v1.13, Reforged half: the second checkout takes all ten
      # engine patches plus the data-path surgery in paths mode (phase 1b
      # only -- its engine binary carries the same hardcoded old-id data
      # paths and must resolve this app's files directory; its Java and
      # resources are never packaged). This tree builds the ONLY two
      # engines the APK ships. The packaging-script patch stays in this
      # sequence too (its knobs are exercised from the base tree's copy
      # of the script, applied and asserted above).
      - name: Apply engine patches (Reforged tree)
        run: |
          set -euo pipefail
          ( cd reforged-src
            git apply --verbose ../reforged-overlay/ci/patches/engine-carryover.patch
            git apply --verbose ../reforged-overlay/ci/patches/smooth-motion.patch
            git apply --verbose ../reforged-overlay/ci/patches/perf-graphics.patch
            git apply --verbose ../reforged-overlay/ci/patches/hitch-removal.patch
            git apply --verbose ../reforged-overlay/ci/patches/60foundations.patch
            git apply --verbose ../reforged-overlay/ci/patches/60flip.patch
            git apply --verbose ../reforged-overlay/ci/patches/package-android-zh-gradle-task.patch
            git apply --verbose ../reforged-overlay/ci/patches/step-perf.patch
            git apply --verbose ../reforged-overlay/ci/patches/speed-pacing-fix.patch
            git apply --verbose ../reforged-overlay/ci/patches/rf60-frontend.patch
            git apply --verbose ../reforged-overlay/ci/patches/fall-gate.patch
            git apply --verbose ../reforged-overlay/ci/patches/fall-gate-v2.patch
            git apply --verbose ../reforged-overlay/ci/patches/resync.patch )
          REFORGED_SRC="${{ github.workspace }}/reforged-src" REFORGED_SURGERY_MODE=paths \
            python3 reforged-overlay/ci/apply-surgery.py
          # Verify the patches actually landed (fail loud, not silent):
          grep -q "Zero Hour Reforged" reforged-src/GeneralsMD/Code/GameEngine/Source/Common/Thing/ThingTemplate.cpp
          grep -q "W3DSmoothMotion" reforged-src/GeneralsMD/Code/GameEngineDevice/Source/W3DDevice/GameClient/W3DDisplay.cpp
          grep -q "smoothMotionCapture" reforged-src/Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DModelDraw.cpp
          test -f reforged-src/Core/GameEngineDevice/Include/W3DDevice/GameClient/W3DSmoothMotion.h
          grep -q "reforgeLighting" reforged-src/Core/GameEngineDevice/Source/W3DDevice/GameClient/WorldHeightMap.cpp
          grep -q "MAX_BUFFERS = 8" reforged-src/Core/GameEngineDevice/Include/W3DDevice/GameClient/W3DTreeBuffer.h
          grep -q "MAX_BRIDGE_VERTEX=32000" reforged-src/GeneralsMD/Code/GameEngineDevice/Include/W3DDevice/GameClient/W3DBridgeBuffer.h
          grep -q "haveLightingKey" reforged-src/Core/Libraries/Source/d3d8gles/src/gles_pipeline.cpp
          grep -q "MIN_AUDIO_CACHE_BYTES" reforged-src/Core/GameEngineDevice/Source/OpenALAudioDevice/OpenALAudioManager.cpp
          grep -q "parkSpentDynamicLights" reforged-src/GeneralsMD/Code/GameEngineDevice/Source/W3DDevice/GameClient/W3DScene.cpp
          grep -q "ConvertRetailFrames" reforged-src/Core/GameEngine/Include/Common/GameCommon.h
          grep -q "retailFrictionToFrame" reforged-src/GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/PhysicsUpdate.cpp
          grep -q "parseRetailPerFrameReal" reforged-src/Core/GameEngine/Include/Common/INI.h
          grep -q "REFORGED_60_STEPS" reforged-src/cmake/config-build.cmake
          grep -q "REFORGED_60_STEPS" reforged-src/CMakeLists.txt
          grep -q "holdToRetailFireCycle" reforged-src/GeneralsMD/Code/GameEngine/Source/GameLogic/AI/AIStates.cpp
          grep -q "countsTowardTemplate" reforged-src/GeneralsMD/Code/GameEngine/Source/Common/RTS/Team.cpp
          grep -q "m_frameRate = LOGICFRAMES_PER_SECOND" reforged-src/Core/GameEngine/Source/GameNetwork/Network.cpp
          grep -q "setFramesPerSecondLimit(LOGICFRAMES_PER_SECOND)" reforged-src/GeneralsMD/Code/GameEngine/Source/Common/GameEngine.cpp
          # Phase 1b landed in this tree too (the paths-mode surgery's own
          # post-check already failed the run if any old-id path remains):
          grep -q "com.louay.zerohour.reforged" reforged-src/Core/GameEngine/Include/Common/GXLogging.h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Android SDK cache
        id: cache-android-sdk
        uses: actions/cache/restore@v4
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-p35-bt35

      - name: Install Android SDK (cmdline-tools + NDK + platform + build-tools)
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${{ env.CMDLINE_TOOLS_VERSION }}_latest.zip"
          echo "${{ env.CMDLINE_TOOLS_SHA1 }}  /tmp/cmdline-tools.zip" | sha1sum -c -
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          sudo chown -R "$(id -u):$(id -g)" /opt/android-sdk
          rm /tmp/cmdline-tools.zip
          SDKMANAGER=/opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;${{ env.NDK_VERSION }}" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Export Android SDK environment
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=/opt/android-sdk/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          test -f "/opt/android-sdk/ndk/${{ env.NDK_VERSION }}/build/cmake/android.toolchain.cmake" \
            || { echo "::error::NDK toolchain file missing after install"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install build tools (meson, ninja, pkg-config, glslang, ccache)
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq || sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends \
            ninja-build meson pkg-config glslang-tools ccache
          meson --version
          ninja --version
          glslangValidator --version | head -1
          ccache --version | head -1

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ env.PRESET }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-${{ env.PRESET }}-

      - name: Configure ccache
        run: |
          set -euo pipefail
          ccache --set-config=max_size=3G
          ccache --set-config=compiler_check=content
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Restore vcpkg cache
        id: cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/vcpkg
            ~/.cache/vcpkg
          key: vcpkg-android-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/triplets/arm64-android.cmake') }}
          restore-keys: |
            vcpkg-android-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Restore DXVK build cache
        id: cache-dxvk
        uses: actions/cache/restore@v4
        with:
          path: build/${{ env.PRESET }}/_deps/dxvk-build-android
          key: dxvk-android-${{ runner.os }}-${{ github.repository }}-${{ env.DXVK_REF }}-${{ hashFiles('Patches/dxvk-android.patch', 'Patches/dxvk-ios.patch', 'cmake/dx8.cmake', 'cmake/meson-arm64-android-cross.ini.in') }}

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [ ! -d /opt/vcpkg/.git ]; then
            git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg
          fi
          CURRENT="$(git -C /opt/vcpkg rev-parse HEAD || echo none)"
          if [ "$CURRENT" != "${{ env.VCPKG_COMMIT }}" ]; then
            git -C /opt/vcpkg fetch origin ${{ env.VCPKG_COMMIT }}
            git -C /opt/vcpkg checkout ${{ env.VCPKG_COMMIT }}
            rm -f /opt/vcpkg/vcpkg
          fi
          if [ ! -f /opt/vcpkg/vcpkg ]; then
            /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
          echo "VCPKG_ROOT=/opt/vcpkg" >> "$GITHUB_ENV"

      # The ALSOFT_BACKEND_*=OFF flags are the v1 build's openal-soft
      # configuration: desktop backends (PipeWire/Pulse/ALSA/...) are
      # Android-irrelevant and the cross-compile cannot use them; Android
      # plays through OpenSL. Everything else mirrors upstream + the local
      # build-apk.sh. v1.13: the base tree is configured ONCE, standard
      # (SAGE_HIGH_FPS_SIM=OFF) -- the host's 60 Hz pass is gone entirely;
      # this build's libmain.so/libgenerals.so are dependency staging
      # only and are never packaged (GX_OMIT_HOST_ENGINES).
      - name: Configure CMake (Android)
        run: |
          set -o pipefail
          mkdir -p logs
          cmake --preset ${{ env.PRESET }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DANDROID_CI_BUILD_NUMBER=${{ github.run_number }} \
            -DSAGE_HIGH_FPS_SIM=OFF \
            -DALSOFT_BACKEND_PIPEWIRE=OFF -DALSOFT_BACKEND_PULSEAUDIO=OFF -DALSOFT_BACKEND_ALSA=OFF \
            -DALSOFT_BACKEND_OSS=OFF -DALSOFT_BACKEND_SNDIO=OFF -DALSOFT_BACKEND_PORTAUDIO=OFF -DALSOFT_BACKEND_JACK=OFF \
            2>&1 | tee logs/configure_android.log
          # The base tree's only configure: standard engines, and the
          # Reforged flip does not exist in this tree at all.
          ! grep -q "^SAGE_HIGH_FPS_SIM:BOOL=ON" build/${{ env.PRESET }}/CMakeCache.txt
          ! grep -q "REFORGED_60_STEPS" build/${{ env.PRESET }}/CMakeCache.txt

      # Target list is the v1 local build's (build-apk.sh). Since v1.13
      # neither engine output is packaged -- the build exists because the
      # packaging script and the shared-library staging (DXVK, hooks,
      # SDL3, OpenAL, GameSpy) read this build tree.
      - name: Build engines (libmain.so + libgenerals.so) + DXVK + hooks
        run: |
          set -o pipefail
          mkdir -p logs
          cmake --build build/${{ env.PRESET }} --target z_generals g_generals dxvk_d3d8_install \
            main_hook file_redirect_hook gsl_alloc_hook hook_impl -- -k 0 2>&1 | tee logs/build_android.log
          ccache --show-stats

      # v1.9: OUR engine, from OUR tree. reforged-src (all ten patches +
      # phase-1b paths) is configured in its own build dir with the flip
      # ON and built first, z_generals only; its libmain.so output ships
      # as libmainrf60.so. (v1.10: the step after this one reconfigures
      # the same build dir with the flip OFF and ships libmainrf.so.)
      # No stash/restore dance (the v1.5-v1.8 Tree B shape) -- the trees
      # are separate checkouts now, so the base tree's standard
      # libmain.so can never be confused with this one.
      - name: Build Reforged 60-steps engine (libmainrf60.so)
        run: |
          set -o pipefail
          mkdir -p logs
          SRCRF="${GITHUB_WORKSPACE}/reforged-src"
          # Configure inside reforged-src ONLY (the preset resolves paths
          # from the working directory, like the main tree's configure);
          # the base tree's own configuration is never touched here.
          ( cd "${SRCRF}" && cmake --preset ${{ env.PRESET }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DANDROID_CI_BUILD_NUMBER=${{ github.run_number }} \
            -DREFORGED_60_STEPS=ON \
            -DALSOFT_BACKEND_PIPEWIRE=OFF -DALSOFT_BACKEND_PULSEAUDIO=OFF -DALSOFT_BACKEND_ALSA=OFF \
            -DALSOFT_BACKEND_OSS=OFF -DALSOFT_BACKEND_SNDIO=OFF -DALSOFT_BACKEND_PORTAUDIO=OFF -DALSOFT_BACKEND_JACK=OFF \
            2>&1 | tee "${GITHUB_WORKSPACE}/logs/configure_reforged.log" )
          # Print the cache state before asserting on it (self-diagnosing).
          grep "^REFORGED_60_STEPS:" "${SRCRF}/build/${{ env.PRESET }}/CMakeCache.txt" || echo "REFORGED_60_STEPS: (absent from CMakeCache.txt)"
          grep "^SAGE_HIGH_FPS_SIM:" "${SRCRF}/build/${{ env.PRESET }}/CMakeCache.txt" || echo "SAGE_HIGH_FPS_SIM: (absent from CMakeCache.txt)"
          grep -q "^REFORGED_60_STEPS:BOOL=ON" "${SRCRF}/build/${{ env.PRESET }}/CMakeCache.txt"
          ! grep -q "^SAGE_HIGH_FPS_SIM:BOOL=ON" "${SRCRF}/build/${{ env.PRESET }}/CMakeCache.txt"
          ( cd "${SRCRF}" && cmake --build build/${{ env.PRESET }} --target z_generals -- -k 0 2>&1 | tee "${GITHUB_WORKSPACE}/logs/build_reforged.log" )
          MAIN_SO="${SRCRF}/build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so"
          [ -f "$MAIN_SO" ] || { echo "::error::reforged z_generals output missing at $MAIN_SO"; exit 1; }
          READELF="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          [ -x "$READELF" ] || { echo "::error::llvm-readelf not found under ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"; exit 1; }
          # Post-build evidence (run #9 lesson): every check captures
          # output first, greps the capture, and PRINTS the evidence
          # before it is allowed to fail; the architecture check retries,
          # like "Verify artifacts".
          ls -la "$MAIN_SO"
          OK=0
          for attempt in 1 2 3 4 5; do
            if HDR="$("$READELF" -h "$MAIN_SO" 2>&1)" && echo "$HDR" | grep -E "Machine:.*AArch64"; then OK=1; break; fi
            echo "readelf attempt ${attempt} did not confirm AArch64; full output was:"
            echo "$HDR"
            sleep 1
          done
          [ "$OK" = "1" ] || { echo "::error::libmainrf60 build is not AArch64 (see the ELF headers printed above)"; exit 1; }
          # The RF60 version stamp must be compiled in (the cross-rate
          # save/replay refusal depends on it). The compiled-in
          # GeneralsOnline client id must be the 30 Hz one and ONLY that
          # one: this engine is not a HIGH_FPS build, and the launcher's
          # clientId() announces CLIENT_ID for exactly the states where
          # this library loads -- the two must agree (v1.9 record 9.4).
          strings "$MAIN_SO" > "${RUNNER_TEMP}/rf60-strings.txt"
          grep " RF60" "${RUNNER_TEMP}/rf60-strings.txt" | head -3 || true
          grep -q " RF60" "${RUNNER_TEMP}/rf60-strings.txt" || { echo "::error::RF60 stamp missing from the 60-steps build"; exit 1; }
          grep -o "gen_online_[0-9]*hz" "${RUNNER_TEMP}/rf60-strings.txt" | sort | uniq -c || true
          grep -q "gen_online_30hz" "${RUNNER_TEMP}/rf60-strings.txt" || { echo "::error::libmainrf60.so lacks the gen_online_30hz client id"; exit 1; }
          if grep -q "gen_online_60hz" "${RUNNER_TEMP}/rf60-strings.txt"; then
            echo "::error::gen_online_60hz found in libmainrf60.so -- the flip tree took the HIGH_FPS define"; exit 1
          fi
          cp "$MAIN_SO" "${GITHUB_WORKSPACE}/libmainrf60.so"
          ls -la "${GITHUB_WORKSPACE}/libmainrf60.so"
          ccache --show-stats

      # v1.10: the SAME patched tree, configured again in the SAME build
      # dir with the flip OFF -- the tree's existing standard
      # configuration, the exact build that shipped as libmain.so in
      # v1.0-v1.8 -- shipped as libmainrf.so; since v1.13 it is simply
      # the standard engine (the Reforged page's 60-steps switch OFF).
      # Reconfiguring one build dir between the
      # two rates is the v1.5-v1.8 dual-pass shape, now entirely inside
      # our own tree; ccache keeps the second pass to the files the flip
      # actually changes. The asserts are the flip step's mirror image:
      # the flip demonstrably OFF, no RF60 stamp, the 30 Hz client id
      # only, and the patched tree's smooth-motion marker present (the
      # marker is compiled in by smooth-motion.patch and survives
      # stripping; measured present in the patched v1.8 engines and
      # absent from the host's pristine 60 Hz engine -- record 10.2).
      - name: Build Reforged standard engine (libmainrf.so)
        run: |
          set -o pipefail
          mkdir -p logs
          SRCRF="${GITHUB_WORKSPACE}/reforged-src"
          ( cd "${SRCRF}" && cmake --preset ${{ env.PRESET }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DANDROID_CI_BUILD_NUMBER=${{ github.run_number }} \
            -DREFORGED_60_STEPS=OFF \
            -DALSOFT_BACKEND_PIPEWIRE=OFF -DALSOFT_BACKEND_PULSEAUDIO=OFF -DALSOFT_BACKEND_ALSA=OFF \
            -DALSOFT_BACKEND_OSS=OFF -DALSOFT_BACKEND_SNDIO=OFF -DALSOFT_BACKEND_PORTAUDIO=OFF -DALSOFT_BACKEND_JACK=OFF \
            2>&1 | tee "${GITHUB_WORKSPACE}/logs/configure_reforged30.log" )
          # Print the cache state before asserting on it (self-diagnosing).
          grep "^REFORGED_60_STEPS:" "${SRCRF}/build/${{ env.PRESET }}/CMakeCache.txt" || echo "REFORGED_60_STEPS: (absent from CMakeCache.txt)"
          grep "^SAGE_HIGH_FPS_SIM:" "${SRCRF}/build/${{ env.PRESET }}/CMakeCache.txt" || echo "SAGE_HIGH_FPS_SIM: (absent from CMakeCache.txt)"
          if grep -q "^REFORGED_60_STEPS:BOOL=ON" "${SRCRF}/build/${{ env.PRESET }}/CMakeCache.txt"; then
            echo "::error::REFORGED_60_STEPS is still ON after the OFF reconfigure -- the standard pass would ship a second 60-steps engine"; exit 1
          fi
          ! grep -q "^SAGE_HIGH_FPS_SIM:BOOL=ON" "${SRCRF}/build/${{ env.PRESET }}/CMakeCache.txt"
          ( cd "${SRCRF}" && cmake --build build/${{ env.PRESET }} --target z_generals -- -k 0 2>&1 | tee "${GITHUB_WORKSPACE}/logs/build_reforged30.log" )
          MAIN_SO="${SRCRF}/build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so"
          [ -f "$MAIN_SO" ] || { echo "::error::reforged standard z_generals output missing at $MAIN_SO"; exit 1; }
          READELF="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          [ -x "$READELF" ] || { echo "::error::llvm-readelf not found under ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"; exit 1; }
          ls -la "$MAIN_SO"
          OK=0
          for attempt in 1 2 3 4 5; do
            if HDR="$("$READELF" -h "$MAIN_SO" 2>&1)" && echo "$HDR" | grep -E "Machine:.*AArch64"; then OK=1; break; fi
            echo "readelf attempt ${attempt} did not confirm AArch64; full output was:"
            echo "$HDR"
            sleep 1
          done
          [ "$OK" = "1" ] || { echo "::error::libmainrf build is not AArch64 (see the ELF headers printed above)"; exit 1; }
          strings "$MAIN_SO" > "${RUNNER_TEMP}/rf30-strings.txt"
          if grep -q " RF60" "${RUNNER_TEMP}/rf30-strings.txt"; then
            echo "::error::RF60 stamp found in the enhanced standard build -- the flip leaked into the OFF pass"; exit 1
          fi
          grep -o "gen_online_[0-9]*hz" "${RUNNER_TEMP}/rf30-strings.txt" | sort | uniq -c || true
          grep -q "gen_online_30hz" "${RUNNER_TEMP}/rf30-strings.txt" || { echo "::error::libmainrf.so lacks the gen_online_30hz client id"; exit 1; }
          if grep -q "gen_online_60hz" "${RUNNER_TEMP}/rf30-strings.txt"; then
            echo "::error::gen_online_60hz found in libmainrf.so -- the standard build took the HIGH_FPS define"; exit 1
          fi
          grep -q "smoothMotionCapture" "${RUNNER_TEMP}/rf30-strings.txt" || { echo "::error::patched-tree marker (smoothMotionCapture) missing from libmainrf.so -- the standard pass did not build the patched tree"; exit 1; }
          cp "$MAIN_SO" "${GITHUB_WORKSPACE}/libmainrf.so"
          ls -la "${GITHUB_WORKSPACE}/libmainrf.so"
          ccache --show-stats

      - name: Verify artifacts
        run: |
          set -euo pipefail
          READELF="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          [ -x "$READELF" ] || { echo "::error::llvm-readelf not found under ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"; exit 1; }
          for lib in "build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so" \
                     "build/${{ env.PRESET }}/Generals/Code/Main/libgenerals.so"; do
            [ -f "$lib" ] || { echo "::error::$lib not found"; exit 1; }
            OK=0
            for attempt in 1 2 3 4 5; do
              # Capture first, grep the capture (run #9 lesson): the old
              # `readelf 2>/dev/null | grep -q` form discarded readelf's
              # stderr and its header alike, so a failure explained
              # nothing. A failed attempt now prints the full output.
              if HDR="$("$READELF" -h "$lib" 2>&1)" && echo "$HDR" | grep -qE "Machine:.*AArch64"; then OK=1; break; fi
              echo "readelf attempt ${attempt} on $lib did not confirm AArch64; full output was:"
              echo "$HDR"
              sleep 1
            done
            if [ "$OK" != "1" ]; then
              ls -la "$lib"
              echo "::error::$lib is not AArch64 (see the ELF headers printed above)"
              exit 1
            fi
          done
          # The 60-steps engine staged at the workspace root by the
          # Reforged-tree step: it must exist, be AArch64, and carry the
          # RF60 stamp.
          LIB60="${GITHUB_WORKSPACE}/libmainrf60.so"
          [ -f "$LIB60" ] || { echo "::error::$LIB60 not found (Reforged-tree staging missing)"; exit 1; }
          ls -la "$LIB60"
          "$READELF" -h "$LIB60"
          "$READELF" -h "$LIB60" | grep -qE "Machine:.*AArch64" || { echo "::error::$LIB60 is not AArch64 (see the ELF header printed above)"; exit 1; }
          strings "$LIB60" | grep -q " RF60" || { echo "::error::$LIB60 lacks the RF60 version stamp"; exit 1; }
          # The standard engine staged by the Reforged tree's standard
          # pass: it must exist, be AArch64, carry NO RF60 stamp and only
          # the 30 Hz client id, and carry the patched tree's
          # smooth-motion marker.
          LIBRF="${GITHUB_WORKSPACE}/libmainrf.so"
          [ -f "$LIBRF" ] || { echo "::error::$LIBRF not found (Reforged-tree standard staging missing)"; exit 1; }
          ls -la "$LIBRF"
          "$READELF" -h "$LIBRF" | grep -qE "Machine:.*AArch64" || { echo "::error::$LIBRF is not AArch64"; exit 1; }
          strings "$LIBRF" > "${RUNNER_TEMP}/rf30-strings.txt"
          if grep -q " RF60" "${RUNNER_TEMP}/rf30-strings.txt"; then
            echo "::error::RF60 stamp found in $LIBRF -- the flip leaked into the standard pass"; exit 1
          fi
          grep -q "gen_online_30hz" "${RUNNER_TEMP}/rf30-strings.txt" || { echo "::error::$LIBRF lacks the gen_online_30hz client id"; exit 1; }
          if grep -q "gen_online_60hz" "${RUNNER_TEMP}/rf30-strings.txt"; then
            echo "::error::gen_online_60hz found in $LIBRF -- the standard build took the HIGH_FPS define"; exit 1
          fi
          grep -q "smoothMotionCapture" "${RUNNER_TEMP}/rf30-strings.txt" || { echo "::error::$LIBRF lacks the patched-tree marker (smoothMotionCapture)"; exit 1; }
          for lib in libdxvk_d3d8.so libdxvk_d3d9.so; do
            [ -f "build/${{ env.PRESET }}/$lib" ] || { echo "::error::$lib missing"; exit 1; }
          done
          strings "build/${{ env.PRESET }}/libdxvk_d3d9.so" | grep -q "SDL3 WSI:" || {
            echo "::error::libdxvk_d3d9.so built without SDL3 WSI"; exit 1; }
          echo "Artifacts verified: AArch64 libmainrf60.so (RF60-stamped) + libmainrf.so (standard, patched-tree marker) + DXVK with SDL3 WSI; base libmain.so + libgenerals.so built for dependency staging only (not packaged since v1.13)"

      # Symbol tables of the unstripped shipped engines (libmainrf.so +
      # libmainrf60.so), kept so crash logs from this build can be
      # symbolized later (a few MB of text each; the libraries themselves
      # are far too big to archive).
      - name: Collect symbol table (before stripping)
        run: |
          set -e
          TOOLS="$(dirname "$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-nm | head -1)")"
          mkdir -p symbols
          # Same for the 60-steps engine (its unstripped copy sits at the
          # workspace root, staged by the Reforged-tree step).
          LIB60="${GITHUB_WORKSPACE}/libmainrf60.so"
          OUT60="symbols/libmainrf60-run${{ github.run_number }}.symbols.txt"
          BUILD_ID60="$(readelf -n "$LIB60" 2>/dev/null | sed -n 's/.*Build ID: \([0-9a-f]*\).*/\1/p' | head -1)"
          {
            echo "# libmainrf60.so symbols -- run ${{ github.run_number }}, commit ${{ github.sha }}"
            echo "# BuildID: ${BUILD_ID60:-UNKNOWN}"
            "$TOOLS/llvm-readelf" --notes --program-headers "$LIB60"
            echo "# --- defined symbols: address size type name ---"
            "$TOOLS/llvm-nm" --defined-only --numeric-sort --print-size --demangle "$LIB60"
          } > "$OUT60"
          gzip -9 "$OUT60"
          # Same for the standard engine (its unstripped copy sits at the
          # workspace root, staged by the Reforged-tree standard pass).
          LIBRF="${GITHUB_WORKSPACE}/libmainrf.so"
          OUTRF="symbols/libmainrf-run${{ github.run_number }}.symbols.txt"
          BUILD_IDRF="$(readelf -n "$LIBRF" 2>/dev/null | sed -n 's/.*Build ID: \([0-9a-f]*\).*/\1/p' | head -1)"
          {
            echo "# libmainrf.so symbols -- run ${{ github.run_number }}, commit ${{ github.sha }}"
            echo "# BuildID: ${BUILD_IDRF:-UNKNOWN}"
            "$TOOLS/llvm-readelf" --notes --program-headers "$LIBRF"
            echo "# --- defined symbols: address size type name ---"
            "$TOOLS/llvm-nm" --defined-only --numeric-sort --print-size --demangle "$LIBRF"
          } > "$OUTRF"
          gzip -9 "$OUTRF"
          ls -la symbols/

      # Strip list is the v1 local build's (build-apk.sh): upstream's list
      # plus libgenerals.so. DXVK libraries are deliberately NOT stripped
      # (see android/app/build.gradle keepDebugSymbols).
      - name: Strip debug symbols
        run: |
          STRIP="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-strip | head -1)"
          for lib in "build/${{ env.PRESET }}/GeneralsMD/Code/Main/libmain.so" \
                     "build/${{ env.PRESET }}/Generals/Code/Main/libgenerals.so" \
                     "build/${{ env.PRESET }}/_deps/sdl3-build/libSDL3.so" \
                     "build/${{ env.PRESET }}/_deps/sdl3_image-build/libSDL3_image.so" \
                     "build/${{ env.PRESET }}/_deps/openal_soft-build/libopenal.so" \
                     "build/${{ env.PRESET }}/libgamespy.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/libadrenotools.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libgsl_alloc_hook.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libhook_impl.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libmain_hook.so" \
                     "build/${{ env.PRESET }}/_deps/adrenotools-build/src/hook/libfile_redirect_hook.so"; do
            [ -f "$lib" ] && "$STRIP" --strip-unneeded "$lib"
          done
          # The 60-steps engine's packaged copy (workspace root) strips too;
          # the packaging script copies exactly this file. Unlike the
          # guarded list above this one is REQUIRED, so a missing file
          # fails loud with its own message instead of a bare strip error.
          [ -f "${GITHUB_WORKSPACE}/libmainrf60.so" ] || { echo "::error::libmainrf60.so missing at strip time (Reforged-tree staging lost)"; exit 1; }
          "$STRIP" --strip-unneeded "${GITHUB_WORKSPACE}/libmainrf60.so"
          # The standard engine's packaged copy, same discipline.
          [ -f "${GITHUB_WORKSPACE}/libmainrf.so" ] || { echo "::error::libmainrf.so missing at strip time (Reforged-tree standard staging lost)"; exit 1; }
          "$STRIP" --strip-unneeded "${GITHUB_WORKSPACE}/libmainrf.so"

      # GX_GRADLE_TASK is the overlay patch's knob: the packaging script
      # stages jniLibs/assets, then runs assembleRelease instead of its
      # default assembleDebug, and its final check looks at the release
      # output path. The release output is signed with the project's own
      # committed debug keystore (project config) -- re-signing with the
      # dedicated release keystore happens locally, never in CI.
      - name: Package APK (release)
        env:
          GX_ANDROID_STAGING: ${{ github.workspace }}/android-staging
          GX_GRADLE_TASK: assembleRelease
          GX_REFORGED60_LIB: ${{ github.workspace }}/libmainrf60.so
          GX_REFORGED_LIB: ${{ github.workspace }}/libmainrf.so
          # v1.13: the host's engines are NOT packaged. The packaging
          # script still stages the shared libraries from the base tree,
          # but this knob (our gradle-task patch) keeps libmain.so and
          # libgenerals.so out of jniLibs -- only the two Reforged
          # engines above enter the APK.
          GX_OMIT_HOST_ENGINES: "1"
          GX_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          GX_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          ./scripts/build/android/package-android-zh.sh

      - name: Locate APK
        id: locate
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then echo "::error::APK not found at $APK"; exit 1; fi
          cp "$APK" "ZeroHourReforged.apk"
          ls -la "ZeroHourReforged.apk"
          echo "path=ZeroHourReforged.apk" >> "$GITHUB_OUTPUT"

      # Every non-system DT_NEEDED of the shipped engines must be inside the APK, or
      # the build would crash with dlopen failed on a real device (upstream
      # CI check, adapted to the v1.13 engine set).
      - name: Verify APK contains every library the shipped engines need
        run: |
          set -euo pipefail
          READELF="$(ls "${ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          [ -x "$READELF" ] || { echo "::error::llvm-readelf not found under ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"; exit 1; }
          APK="${{ steps.locate.outputs.path }}"
          WORKDIR="$(mktemp -d)"
          unzip -q "${APK}" 'lib/arm64-v8a/*' -d "${WORKDIR}"
          echo "Packaged libraries:"
          ls "${WORKDIR}/lib/arm64-v8a/"
          # Engine set, exactly (v1.13): ONLY our two engines. The
          # host's four libraries are forbidden outright -- any one of
          # them in the APK fails the build -- and the *60.so set is
          # exactly {libmainrf60.so} (ls sorts).
          for required in libmainrf60.so libmainrf.so; do
            if [ ! -f "${WORKDIR}/lib/arm64-v8a/${required}" ]; then
              echo "::error::required engine library ${required} is missing from the APK"
              exit 1
            fi
          done
          for forbidden in libmain.so libmain60.so libgenerals.so libgenerals60.so; do
            if [ -f "${WORKDIR}/lib/arm64-v8a/${forbidden}" ]; then
              echo "::error::host engine library ${forbidden} is packaged in the APK -- v1.13 ships the Reforged engines only"
              exit 1
            fi
          done
          SIXTY="$(ls "${WORKDIR}/lib/arm64-v8a/" | grep -E '^lib.*60\.so$' || true)"
          if [ "${SIXTY}" != "libmainrf60.so" ]; then
            echo "::error::unexpected *60.so set in the APK: '${SIXTY}' (only libmainrf60.so is allowed)"
            exit 1
          fi
          missing=0
          for engine in libmainrf60.so libmainrf.so; do
            NEEDED="$("${READELF}" -d "${WORKDIR}/lib/arm64-v8a/${engine}" | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/')"
            for lib in ${NEEDED}; do
              case "${lib}" in
                libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libGLESv*|libEGL.so|libvulkan.so|libOpenSLES.so|libaaudio.so|libmediandk.so|libcamera2ndk.so|libjnigraphics.so|libnativewindow.so|libsync.so|libz.so)
                  continue ;;
              esac
              if [ ! -f "${WORKDIR}/lib/arm64-v8a/${lib}" ]; then
                echo "::error::${engine} needs '${lib}' at runtime but it is not packaged in the APK"
                missing=1
              fi
            done
          done
          rm -rf "${WORKDIR}"
          if [ "${missing}" -ne 0 ]; then
            echo "::error::APK is missing required native libraries."
            exit 1
          fi
          echo "OK: engine set exact (libmainrf.so + libmainrf60.so only), and every DT_NEEDED of both engines is present in the APK."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroHourReforged-apk
          path: ${{ steps.locate.outputs.path }}
          # Free-plan Actions storage is a small account-wide quota and an
          # APK is ~55 MB; 7 days is ample to pull a build down for the
          # local re-sign + Release step.
          retention-days: 7

      - name: Upload symbol table artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-symbols-run${{ github.run_number }}
          path: symbols/
          retention-days: 90

      - name: Collect dependency build logs for diagnosis
        if: always()
        run: |
          mkdir -p logs
          cp build/${{ env.PRESET }}/vcpkg-manifest-install.log logs/ 2>/dev/null || true
          if [ -d /opt/vcpkg/buildtrees ]; then
            find /opt/vcpkg/buildtrees -maxdepth 2 -name "*.log" -newer .git -exec cp {} logs/ \; 2>/dev/null || true
          fi
          cp build/${{ env.PRESET }}/_deps/dxvk-build-android/meson-logs/meson-log.txt logs/dxvk-meson-log.txt 2>/dev/null || true
          ls -la logs/ || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      # Save caches even when the job failed (upstream discipline: a failed
      # run must not force the next one to rebuild ffmpeg/openssl/DXVK from
      # scratch). Guard each save so an exact-key restore hit doesn't fail.
      - name: Save Android SDK cache
        if: always() && steps.cache-android-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-p35-bt35

      - name: Save vcpkg cache
        if: always() && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /opt/vcpkg
            ~/.cache/vcpkg
          key: vcpkg-android-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json', 'cmake/triplets/arm64-android.cmake') }}

      - name: Save DXVK build cache
        if: always() && steps.cache-dxvk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/${{ env.PRESET }}/_deps/dxvk-build-android
          key: dxvk-android-${{ runner.os }}-${{ github.repository }}-${{ env.DXVK_REF }}-${{ hashFiles('Patches/dxvk-android.patch', 'Patches/dxvk-ios.patch', 'cmake/dx8.cmake', 'cmake/meson-arm64-android-cross.ini.in') }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ env.PRESET }}-${{ github.run_id }}
